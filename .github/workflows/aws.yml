name: Deploy Microservices to Amazon ECS

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: eu-north-1
  # ECR repositories (one per service)
  ECR_ADMIN: admin-service
  ECR_AUTH: auth-service
  ECR_BODY: body-service
  ECR_WEB: web-service

  ECS_CLUSTER: shifatech-cluster
  ECS_SERVICE: shifatech-service
  ECS_TASK_DEFINITION: .aws/task-definition.json

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Images
        id: build-images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ADMIN SERVICE
          docker build -t $ECR_REGISTRY/$ECR_ADMIN:$IMAGE_TAG ./Backend/admin-service
          docker push $ECR_REGISTRY/$ECR_ADMIN:$IMAGE_TAG

          # AUTH SERVICE
          docker build -t $ECR_REGISTRY/$ECR_AUTH:$IMAGE_TAG ./Backend/auth-service
          docker push $ECR_REGISTRY/$ECR_AUTH:$IMAGE_TAG

          # BODY SERVICE
          docker build -t $ECR_REGISTRY/$ECR_BODY:$IMAGE_TAG ./Backend/body-service
          docker push $ECR_REGISTRY/$ECR_BODY:$IMAGE_TAG

          # WEB SERVICE
          docker build -t $ECR_REGISTRY/$ECR_WEB:$IMAGE_TAG ./Frontend/Web
          docker push $ECR_REGISTRY/$ECR_WEB:$IMAGE_TAG

          echo "ADMIN_IMAGE=$ECR_REGISTRY/$ECR_ADMIN:$IMAGE_TAG" >> $GITHUB_ENV
          echo "AUTH_IMAGE=$ECR_REGISTRY/$ECR_AUTH:$IMAGE_TAG" >> $GITHUB_ENV
          echo "BODY_IMAGE=$ECR_REGISTRY/$ECR_BODY:$IMAGE_TAG" >> $GITHUB_ENV
          echo "WEB_IMAGE=$ECR_REGISTRY/$ECR_WEB:$IMAGE_TAG" >> $GITHUB_ENV

      # Render task definition step-by-step (IMPORTANT: chain outputs correctly)

      - name: Render admin container
        id: render-admin
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: admin-service
          image: ${{ env.ADMIN_IMAGE }}

      - name: Render auth container
        id: render-auth
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-admin.outputs.task-definition }}
          container-name: auth-service
          image: ${{ env.AUTH_IMAGE }}

      - name: Render body container
        id: render-body
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-auth.outputs.task-definition }}
          container-name: body-service
          image: ${{ env.BODY_IMAGE }}

      - name: Render web container
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-body.outputs.task-definition }}
          container-name: web-service
          image: ${{ env.WEB_IMAGE }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
