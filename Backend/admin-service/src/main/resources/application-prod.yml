# ===================================================================
# CONFIGUATION DE PRODUCTION (GMAIL / SMTP PRO)
# ===================================================================
# Activer avec: -Dspring.profiles.active=prod
# ===================================================================

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    # Utilisez des variables d'environnement pour ne pas laisser vos identifiants en clair dans le code
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Paramètres de résilience en production (plus conservateurs)
resilience4j:
  circuitbreaker:
    instances:
      rdv-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
