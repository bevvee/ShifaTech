spring.application.name=admin-service

# ===========================
# DATABASE
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${ADMIN_DB_HOST:localhost}:${ADMIN_DB_PORT:3306}/${ADMIN_DB_NAME:admindb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${ADMIN_DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${ADMIN_DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Auth API
auth.service.email=${AUTH_EMAIL}
auth.service.password=${AUTH_PASSWORD}

# ===========================
# SMTP — MailHog (local)
# ===========================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=noreply@shifatech.local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false