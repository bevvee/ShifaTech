server:
  port: 8080

spring:
  application:
    name: admin-service

  flyway:
    enabled: false

  datasource:
    url: jdbc:mysql://admin-db:3306/admindb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: adminuser
    password: adminpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: mailhog
    port: 1025
    username: noreply@shifatech.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

auth:
  service:
    email: ${AUTH_SERVICE_EMAIL:}
    password: ${AUTH_SERVICE_PASSWORD:}

app:
  auth-service-url: ${APP_AUTH_SERVICE_URL:http://auth-service:8080}
  rdv-service-url: ${APP_RDV_SERVICE_URL:http://rdv-service:9000}
  doctor-service-url: ${APP_DOCTOR_SERVICE_URL:http://doctor-service:8080}
  infirmier-service-url: ${APP_INFIRMIER_SERVICE_URL:http://infirmier-service:9000}
  patient-service-url: ${APP_PATIENT_SERVICE_URL:http://patient-service:8080}
