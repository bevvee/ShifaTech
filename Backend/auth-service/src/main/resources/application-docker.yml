spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${AUTH_DB_HOST:mysql-db}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME:authdb}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${AUTH_DB_USER:authuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${AUTH_DB_PASSWORD:authpass}}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
