spring:
  application:
    name: DoctorService

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doctor_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

  # Moved server port correctly under spring (or root, server.port is root usually)
server:
  port: 8080

jwt:
  secret: "elaazzouzi-mohammed-amine-oussama-bouikourdassen-nissrine-belmir-farah-bentiress-chaimae-lefrouji-pfa-2026"
  accessMillis: 3600000

# Custom Application Config
application:
  config:
    # Docker Internal URLs (Service Discovery by Container Name)
    auth-service-url: http://auth-service:8080
    patient-service-url: http://patient-service:8080
    appointment-service-url: http://rdv-service:9000

springdoc:
  api-docs:
    path: /v3/api-docs   # OpenAPI JSON path
  swagger-ui:
    path: /swagger-ui.html
    url: /doctor/v3/api-docs     # Makes Swagger UI load your API by default
  operations-sorter: alpha
  tags-sorter: alpha
