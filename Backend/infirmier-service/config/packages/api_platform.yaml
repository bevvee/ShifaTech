api_platform:
    title: 'Infirmier Service API'
    version: 1.0.0

    swagger:
        versions: [3]
        api_keys:
            JWT:
                name: Authorization
                type: header
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    enable_swagger_ui: true
    enable_re_doc: true
    enable_docs: true

    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
