security:
    firewalls:
        api:
            pattern: ^/
            stateless: true
            jwt: ~   # le token JWT doit être présent

    access_control:
        - { path: ^/planning, roles: [ ROLE_SECRETARY, ROLE_NURSE ] }
        - { path: ^/rendezvous/planifier, roles: ROLE_SECRETARY }
        - { path: ^/soin/etat, roles: ROLE_NURSE }
        - { path: ^/dossiers, roles: ROLE_SECRETARY }
        - { path: ^/fiches, roles: ROLE_SECRETARY }
        - { path: ^/rendezvous, roles: [ ROLE_SECRETARY, ROLE_NURSE ] }
