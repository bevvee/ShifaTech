api_platform:
    title: 'RDV Service API'
    version: '1.0.0'
    description: 'Rendez-vous Management Service'

    defaults:
        pagination_enabled: true
        pagination_items_per_page: 10
        pagination_maximum_items_per_page: 50


    swagger:
        versions: [3]
        api_keys:
            JWT:
                name: Authorization
                type: header

    enable_swagger_ui: true
    enable_re_doc: true
    enable_docs: true

    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
