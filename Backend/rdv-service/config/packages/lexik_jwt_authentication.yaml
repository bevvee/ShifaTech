lexik_jwt_authentication:
    secret_key: '%env(JWT_SECRET_KEY)%'
    public_key: ~  # Set to null for HS256
    user_id_claim: sub  # ← This will use "3" as identifier

    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
    encoder:
        service: lexik_jwt_authentication.encoder.lcobucci
        signature_algorithm: HS256  # ← Change from RS256 to HS256
