<div class="min-h-screen bg-[#F5F6F8]">
  <!-- Mobile backdrop -->
  <div
    class="fixed inset-0 z-30 bg-black/30 lg:hidden"
    [class.hidden]="!sidebarOpen"
    (click)="sidebarOpen = false"
  ></div>

  <div class="flex">
    <st-sidebar
      class="shrink-0 fixed inset-y-0 left-0 z-40 w-2xs bg-white border-r border-slate-200 transform transition-transform duration-300 ease-out -translate-x-full lg:translate-x-0"
      [class.-translate-x-full]="!sidebarOpen"
      [class.translate-x-0]="sidebarOpen"
      [items]="items"
      [activeRoute]="activeRoute"
      (requestClose)="sidebarOpen = false"
    />

    <main class="flex-1 min-w-0 lg:pl-72 ">
      <st-topbar (toggleSidebar)="toggleSidebar()" />

      <div class="px-6 py-6">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
