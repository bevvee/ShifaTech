<!-- Sidebar -->
<aside class="h-full w-full bg-white flex flex-col">
  <!-- Header -->
  <div class="py-1 px-4 flex items-center justify-between border-b border-slate-200">
    <div class="flex items-center gap-2">
      <img src="assets/images/ST.png" class="h-12" />
      <div class="min-w-0">
        <div class="text-lg font-bold tracking-tight select-none">
          <span class="text-[#105082]">Shifa</span>
          <span class="text-[#3CA169] bg-clip-text"> Tech </span>
        </div>
      </div>
    </div>

    <button
      class="lg:hidden h-9 w-9 flex items-center justify-center rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50"
      (click)="requestClose.emit()"
      aria-label="Close sidebar"
    >
      ✕
    </button>
  </div>

  <!-- Menu -->
  <nav class="flex-1 overflow-y-auto px-4 py-8 space-y-1">
    <div class="px-3 mb-2 text-xs font-medium tracking-wider text-slate-400">
    Main
  </div>
    <ng-container *ngFor="let item of items">
      <!-- GROUP DROPDOWN -->
<div *ngIf="isGroup(item)" class="dropdown-container">

 <button
(click)="toggleGroup(item.label, $event)"
  class="group w-full flex items-center justify-between px-3 py-2 rounded-xl
         transition-colors duration-200"
  [ngClass]="
    openGroup === item.label
      ? 'bg-green-50 text-[#3CA169]'
      : 'text-slate-700 hover:bg-slate-50'
  "
>
  <div class="flex items-center gap-3">
    <app-icon [name]="item.icon"></app-icon>
    <span class="text-sm font-medium">{{ item.label }}</span>
  </div>

  <span
    class="material-icons transition-transform"
    [class.rotate-180]="openGroup === item.label"
  >
    expand_more
  </span>
</button>


  <!-- CHILDREN -->
  <div *ngIf="openGroup === item.label" class="relative ml-7 mt-2">

    <!-- TIMELINE DROPDOWN -->
<div *ngIf="openGroup === item.label" class="pl-2 mt-2">

  <div
    *ngFor="let child of item.children; let first = first; let last = last"
    class="group flex gap-x-3"
  >

    <!-- LEFT TIMELINE -->
    <div class="relative w-6 flex justify-center">

      <!-- TOP LINE -->
      <div
        *ngIf="!first"
        class="absolute top-0 h-1/2 w-px border-l border-dashed border-slate-300">
      </div>

      <!-- BOTTOM LINE -->
      <div
        *ngIf="!last"
        class="absolute bottom-0 h-1/2 w-px border-l border-dashed border-slate-300">
      </div>

      <!-- CIRCLE -->
      <div       routerLinkActive="text-green-400"

        class="relative z-10 mt-2 w-3 h-3 rounded-full border-2 border-slate-300 bg-white
               transition-all duration-200
               group-hover:border-[#3CA169] group-hover:-green-400">
      </div>

    </div>

    <!-- RIGHT LINK -->
    <a
      [routerLink]="child.route"
      routerLinkActive="text-green-400 font-semibold"
      class="flex-1 pb-4 text-sm text-slate-500 transition-colors
             group-hover:text-green-400"
    >
      {{ child.label }}
    </a>

  </div>

</div>


  </div>
</div>

      <!-- SIMPLE LINK -->
      <a
        *ngIf="!isGroup(item) && item.route"
        [routerLink]="item.route"
        routerLinkActive="bg-green-50 text-green-500"
        class="group h-10 flex items-center gap-3 px-3 rounded-xl text-green-500 hover:text-green-500 hover:bg-green-50"
      >
        <app-icon [name]="item.icon"></app-icon>
        <span class="text-sm font-medium">
          {{ item.label }}
        </span>
      </a>
    </ng-container>
  </nav>
</aside>
