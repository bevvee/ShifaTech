<aside class="h-screen w-64 bg-white border-r border-gray-200 flex flex-col">
  <!-- Brand -->
  <div class="h-16 px-6 flex items-center gap-3 border-b border-gray-200">
    <div class="flex items-center justify-center">
      <img src="assets/images/ST.png" alt="ShifaTech" class="h-12 w-auto"/>
    </div>
    <div class="text-lg font-semibold tracking-wide">
      <span class="font-poetsen">Shifa</span>
      <span class="font-poppins">Tech</span>
    </div>
  </div>

  <!-- MENU -->
  <div class="px-6 py-4 text-xs uppercase text-gray-400 tracking-wider">
    Menu principal
  </div>

  <nav class="px-3 space-y-2 overflow-y-auto pb-6">
    <ng-container *ngFor="let item of items">

      <!-- GROUP -->
      <div *ngIf="isGroup(item)" class="rounded-xl">
        <button
          type="button"
          (click)="toggleGroup(item.label)"
          class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl transition
                 hover:bg-gray-100"
          [class.bg-gray-50]="openKey === item.label || isChildActive(item)"
        >
          <div class="flex items-center gap-3">
            <span class="material-icons text-xl text-gray-600">{{ item.icon }}</span>
            <span class="text-sm font-semibold text-gray-800">{{ item.label }}</span>
          </div>

          <span
            class="material-icons text-xl text-gray-500 transition-transform"
            [class.rotate-180]="openKey === item.label"
          >
            expand_more
          </span>
        </button>

        <!-- SUBMENU -->
        <div *ngIf="openKey === item.label" class="mt-2 ml-10 space-y-1">
          <a
            *ngFor="let child of item.children"
            [routerLink]="child.route"
            routerLinkActive="text-blue-700 font-semibold"
            class="block px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 transition"
          >
            {{ child.label }}
          </a>
        </div>
      </div>

      <!-- SIMPLE LINK -->
      <a
        *ngIf="!isGroup(item)"
        [routerLink]="item.route"
        routerLinkActive="bg-blue-50 text-blue-700"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-100 transition"
      >
        <span class="material-icons text-xl">{{ item.icon }}</span>
        <span class="text-sm font-medium">{{ item.label }}</span>
      </a>

    </ng-container>
  </nav>
</aside>
