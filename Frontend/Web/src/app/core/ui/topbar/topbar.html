<header #root class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur">
  <div class="px-4 sm:px-6 py-3 flex items-center gap-3">
    <!-- Sidebar toggle (optional wiring) -->
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="h-10 w-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-700 hover:bg-slate-50"
      aria-label="Toggle sidebar"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Title -->
    <div class="min-w-0">
      <div class="text-base sm:text-lg font-semibold text-slate-900 truncate">{{ computedTitle }}</div>
      <div *ngIf="computedSubtitle" class="text-xs text-slate-500 truncate">{{ computedSubtitle }}</div>
    </div>

    <!-- Desktop search -->
    <div *ngIf="showSearch" class="hidden lg:block flex-1 px-4">
      <div class="relative max-w-2xl">
        <input
          type="search"
          class="w-full h-11 pl-11 pr-10 rounded-2xl bg-white border border-slate-200 text-slate-900
                 placeholder:text-slate-400 outline-none
                 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-600"
          [placeholder]="searchPlaceholder"
          [value]="searchValue"
          (input)="onSearchInput(($any($event.target).value))"
        />

        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="2" />
          </svg>
        </span>

        <button
          *ngIf="searchValue"
          type="button"
          (click)="clearSearch()"
          class="absolute right-3 top-1/2 -translate-y-1/2 h-8 w-8 rounded-xl
                 text-slate-500 hover:bg-slate-100 flex items-center justify-center"
          aria-label="Clear search"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="m6 6 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="ms-auto flex items-center gap-2">
      <!-- Mobile search toggle -->
      <button
        *ngIf="showSearch"
        type="button"
        (click)="mobileSearchOpen = !mobileSearchOpen"
        class="h-10 w-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-700 hover:bg-slate-50 lg:hidden"
        aria-label="Search"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
          <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>

      <!-- Notifications -->
      <div *ngIf="showNotifications" class="relative">
        <button
          type="button"
          (click)="toggleNotifications()"
          class="h-10 w-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center hover:bg-slate-50"
          aria-label="Notifications"
        >
          <svg class="h-5 w-5 text-slate-700" viewBox="0 0 24 24" fill="none">
            <path d="M12 2a7 7 0 0 1 7 7c0 2-1 3-1 3H6s-1-1-1-3a7 7 0 0 1 7-7Z" stroke="currentColor" stroke-width="2" />
            <path d="M10 20a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>

        <div
          *ngIf="notificationsOpen"
          class="absolute right-0 mt-2 w-80 rounded-2xl bg-white border border-slate-200 shadow-xl overflow-hidden"
          role="menu"
        >
          <div class="px-4 py-3 flex items-center justify-between">
            <div class="text-sm font-semibold text-slate-900">Notifications</div>
            <button type="button" class="text-xs text-slate-500 hover:text-slate-700" (click)="notificationsOpen = false">Close</button>
          </div>
          <div class="px-4 pb-4 text-sm text-slate-600">
            No notifications yet.
          </div>
        </div>
      </div>

      <!-- Profile -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleProfile()"
          class="h-10 px-2 rounded-xl bg-white border border-slate-200 flex items-center gap-2 hover:bg-slate-50"
          aria-label="User menu"
        >
          <div class="h-8 w-8 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs font-semibold">
            {{ initials }}
          </div>
          <div class="hidden md:block text-left">
            <div class="text-sm font-semibold text-slate-900 leading-4">{{ userName }}</div>
            <div class="text-xs text-slate-500">{{ userRole }}</div>
          </div>
          <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none">
            <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div
          *ngIf="profileOpen"
          class="absolute right-0 mt-2 w-56 rounded-2xl bg-white border border-slate-200 shadow-xl overflow-hidden"
          role="menu"
        >
          <div class="px-4 py-3 border-b border-slate-200">
            <div class="text-sm font-semibold text-slate-900">{{ userName }}</div>
            <div class="text-xs text-slate-500">{{ userRole }}</div>
          </div>
          <button type="button" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Profile</button>
          <button type="button" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Settings</button>
          <div class="h-px bg-slate-200"></div>
          <button type="button" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile search panel -->
  <div *ngIf="showSearch && mobileSearchOpen" class="px-4 sm:px-6 pb-3 lg:hidden">
    <div class="relative">
      <input
        type="search"
        class="w-full h-11 pl-11 pr-10 rounded-2xl bg-white border border-slate-200 text-slate-900
               placeholder:text-slate-400 outline-none
               focus:ring-4 focus:ring-indigo-100 focus:border-indigo-600"
        [placeholder]="searchPlaceholder"
        [value]="searchValue"
        (input)="onSearchInput(($any($event.target).value))"
      />
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
          <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="2" />
        </svg>
      </span>
      <button
        *ngIf="searchValue"
        type="button"
        (click)="clearSearch()"
        class="absolute right-3 top-1/2 -translate-y-1/2 h-8 w-8 rounded-xl
               text-slate-500 hover:bg-slate-100 flex items-center justify-center"
        aria-label="Clear search"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
          <path d="M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="m6 6 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>
</header>
