<div class="flex items-center justify-between mb-5">
  <h1 class="text-2xl font-bold text-slate-900">Admin Dashboard</h1>

  <div class="flex items-center gap-3">
    <button class="h-11 px-4 rounded-xl bg-indigo-600 text-white font-semibold flex items-center gap-2">
      <span class="text-xl leading-none">+</span> New Appointment
    </button>
    <button class="h-11 px-4 rounded-xl bg-white border border-slate-200 text-slate-800 font-semibold">
      Schedule Availability
    </button>
  </div>
</div>

<st-kpi-cards [kpis]="kpis"></st-kpi-cards>

<div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-6">
  <st-appointment-stats
    class="xl:col-span-2"
    [tabs]="statsTabs"
    [months]="months"
    [bars]="bars"
  ></st-appointment-stats>

  <st-appointments-widget
    [calendarTitle]="calendarTitle"
    [weekDays]="weekDays"
    [calendarGrid]="calendarGrid"
    [selectedDay]="selectedDay"
    [upcoming]="upcoming"
  ></st-appointments-widget>
</div>
