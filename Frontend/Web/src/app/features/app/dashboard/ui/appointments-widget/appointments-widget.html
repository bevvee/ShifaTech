<section class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
  <div class="p-5 flex items-center justify-between">
    <h2 class="text-lg font-bold text-slate-900">Appointments</h2>
    <button class="h-10 px-3 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold">
      All Type
    </button>
  </div>

  <div class="px-5 pb-5">
    <div class="rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <button class="h-9 w-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-700">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="font-semibold text-slate-900">{{ calendarTitle }}</div>

        <button class="h-9 w-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-700">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-7 text-xs text-slate-400 mb-2">
        <div *ngFor="let d of weekDays" class="text-center py-1 font-semibold">{{ d }}</div>
      </div>

      <div class="grid grid-cols-7 gap-1">
        <button
          *ngFor="let day of calendarGrid"
          class="h-9 rounded-xl text-sm font-semibold flex items-center justify-center"
          [ngClass]="
            !day ? 'text-slate-300 cursor-default' :
            day === selectedDay ? 'bg-indigo-600 text-white' :
            'text-slate-700 hover:bg-slate-100'
          "
          [disabled]="!day"
        >
          {{ day || '' }}
        </button>
      </div>

      <div class="mt-4 rounded-2xl bg-slate-50 border border-slate-200 p-4">
        <div class="font-semibold text-slate-900">{{ upcoming.title }}</div>
        <div class="text-sm text-slate-500 mt-1 flex items-center gap-2">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M7 2v3M17 2v3M4 7h16M6 10h4M6 14h4M14 10h4M14 14h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>{{ upcoming.dateLabel }}, {{ upcoming.timeLabel }}</span>
        </div>
      </div>
    </div>

    <button class="fixed right-6 top-1/2 -translate-y-1/2 h-12 w-12 rounded-xl bg-indigo-600 text-white shadow-lg flex items-center justify-center">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
        <path d="M19.4 15a7.9 7.9 0 0 0 .1-2l2-1.2-2-3.4-2.3.6a8 8 0 0 0-1.7-1L13 5h-2L8.6 8a8 8 0 0 0-1.7 1l-2.3-.6-2 3.4 2 1.2a7.9 7.9 0 0 0 .1 2l-2 1.2 2 3.4 2.3-.6a8 8 0 0 0 1.7 1L11 23h2l2.4-3a8 8 0 0 0 1.7-1l2.3.6 2-3.4-2-1.2Z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
