<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
  <div *ngFor="let k of kpis" class="bg-white border border-slate-200 rounded-2xl p-4 relative overflow-hidden">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div class="h-11 w-11 rounded-2xl flex items-center justify-center" [ngClass]="k.iconBg">
          <svg class="h-6 w-6" [ngClass]="k.iconColor" viewBox="0 0 24 24" fill="none">
            <path d="M7 2v3M17 2v3M4 7h16M6 10h4M6 14h4M14 10h4M14 14h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="text-slate-500 font-medium">{{ k.title }}</div>
          <div class="text-2xl font-bold text-slate-900">{{ k.value }}</div>
        </div>
      </div>

      <span class="text-xs font-bold px-2 py-1 rounded-lg"
        [ngClass]="k.deltaType === 'up' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'">
        {{ k.delta }}
      </span>
    </div>

    <div class="mt-2 text-sm text-slate-500">{{ k.note }}</div>

    <div class="mt-3 h-10">
      <svg viewBox="0 0 120 28" class="w-full h-full">
        <path d="M2 24 L18 20 L34 22 L50 14 L66 18 L82 10 L98 12 L118 6"
              fill="none" stroke="currentColor" stroke-width="3"
              class="text-slate-800/20"/>
      </svg>
    </div>

    <div class="absolute -left-10 top-0 h-40 w-40 rotate-45 bg-slate-100"></div>
  </div>
</div>
