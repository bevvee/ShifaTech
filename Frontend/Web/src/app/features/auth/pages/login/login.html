<div class="min-h-screen grid lg:grid-cols-2 bg-gray-50">
  <!-- Left image -->
  <div class="hidden lg:block relative">
    <img
      class="absolute inset-0 h-full w-full object-cover"
      src="assets/images/doct.png"
      alt="Professionnels de santé dans un couloir"
    />
    <div class="absolute inset-0 bg-black/20"></div>
  </div>

  <!-- Right form -->
  <div class="flex flex-col justify-center px-6 py-10 lg:px-14">
    <div class="max-w-md w-full mx-auto">
      <!-- Brand -->
      <div class="flex justify-center mb-6">
        <img src="assets/images/ST.png" alt="ShifaTech" class="h-14 w-auto" />
      </div>

      <!-- Card -->
      <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6">
        <h1 class="text-2xl font-semibold text-gray-900">Bon retour</h1>
        <p class="text-sm text-gray-500 mt-1">
          Entrez vos identifiants pour accéder à votre compte
        </p>

        <form class="mt-6 space-y-4" (submit)="$event.preventDefault()">
          <div>
            <label class="block text-sm font-medium text-gray-700" for="username">
              Nom d'utilisateur
            </label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Entrez votre identité"
              class="mt-1 w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-900 placeholder:text-gray-400
                     focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700" for="password">
              Mot de passe
            </label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Entrez votre mot de passe"
              class="mt-1 w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-900 placeholder:text-gray-400
                     focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
            />
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-sm text-gray-700">
              <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600" />
              <span>Se souvenir de moi</span>
            </label>

            <a class="text-sm text-blue-700 hover:underline" href="#">
              mot de passe oublié ?
            </a>
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-blue-700 px-4 py-3 text-white font-medium hover:bg-blue-800
                   focus:outline-none focus:ring-2 focus:ring-blue-600"
          >
            Se connecter
          </button>

          <div class="text-sm text-gray-600 pt-2">
            <span>Vous n'avez pas de compte ? </span>
            <a class="text-blue-700 hover:underline" href="#">Contacter l'administrateur</a>
          </div>
        </form>
      </div>

      <p class="text-xs text-gray-400 text-center mt-6">
        © 2025 ShifaTech. All rights reserved.
      </p>
    </div>
  </div>
</div>
