<div class="relative min-h-screen flex items-center justify-center px-4 overflow-hidden bg-slate-50">

  <!-- ===== MEDICAL ANIMATED BACKGROUND ===== -->
  <div class="absolute inset-0 medical-bg"></div>

  <!-- ===== CONTENT WRAPPER ===== -->
  <div class="relative z-10 w-full flex flex-col items-center">

    <!-- Brand -->
    <div class="flex items-center gap-2 mb-2 select-none">
      <img src="assets/images/ST.png" class="h-16 w-auto" />
      <span class="text-2xl font-semibold text-gray-800">
        <span class="text-[#105082]">Shifa</span>
        <span class="text-[#3CA169]">Tech</span>
      </span>
    </div>

    <!-- Card -->
    <div
      class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-200
             px-6 py-7 sm:px-8 sm:py-8 transition-all duration-300"
    >

      <h2 class="text-base sm:text-2xl font-medium text-center text-gray-900">
        Bon retour
      </h2>

      <p class="text-sm text-gray-500 mt-1 text-center">
        Entrez vos identifiants pour accéder à votre compte
      </p>

      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="onSubmit()">

        <st-input
          id="email"
          label="Adresse mail"
          placeholder="Entrer l'adresse mail"
          type="email"
          icon="mail"
          [control]="email"
        />

        <st-input
          id="password"
          label="Mot de passe"
          placeholder="**************"
          type="password"
          icon="lock"
          [control]="password"
          class="mt-2"
        />

        <div class="flex items-center justify-between">
          <st-checkbox id="rememberMe" label="Sw souvenir de moi" [control]="rememberMe"></st-checkbox>

          <a class="text-sm text-red-500 hover:underline cursor-pointer">
            Mot de passe oublié ?
          </a>
        </div>

        <button
          type="submit"
          class="w-full h-11 rounded-lg bg-[#3CA169] text-white font-medium
                 hover:bg-[#63cf94] active:scale-[0.98] transition"
        >
          Se connecter
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 py-1">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-xs text-gray-500">OU</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>


          <button
          type="button"
          (click)="onGoogleLogin()"
          class="w-full hover:bg-gray-50 hover:shadow-lg h-11 flex justify-center font-medium items-center rounded-lg border border-black bg-white"
        >
            <app-icon name="google" class="pr-2"></app-icon> Connecter avec Google
        </button>

        <div class="text-sm text-gray-600 text-center">
          Vous n'avez pas de compte ?
          <span class="text-[#3CA169] hover:underline cursor-pointer">
            Contacter l'administration
          </span>
        </div>

      </form>
    </div>

    <p class="text-sm text-gray-700 mt-6 text-center">
      Copyright © 2025 - ShifaTech
    </p>

  </div>
</div>
