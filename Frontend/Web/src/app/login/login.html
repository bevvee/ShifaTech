<div class="login-page">
  <!-- Left side visual -->
  <div class="left-visual" aria-hidden="true">
    <img src="/images/doct.png" alt="Professionnels de santé dans un couloir" />
  </div>

  <!-- Right side form -->
  <div class="right-form">
    <div class="brand-wrap">
      <img src="/images/ST.png" alt="ShifaTech" class="brand-logo" />
    </div>

    <div class="card">
      <h1 class="title">Bon retour</h1>
      <p class="subtitle">Entrez vos identifiants pour accéder à votre compte</p>

      <form class="form" (submit)="$event.preventDefault()">
        <label class="label" for="username">Nom d'utilisateur</label>
        <input id="username" name="username" type="text" class="input" placeholder="Entrez votre identity" autocomplete="username" />

        <label class="label" for="password">Mot de passe</label>
        <input id="password" name="password" type="password" class="input" placeholder="Entrez votre identity" autocomplete="current-password" />

        <div class="row">
          <label class="remember">
            <input type="checkbox" />
            <span>Se souvenir de moi</span>
          </label>
          <a class="link" href="#">mot de passe oublié ?</a>
        </div>

        <button type="submit" class="submit">Se connecter</button>
      </form>

      <div class="help">
        <span>Vous n'avez pas de compte ?</span>
        <a class="link" href="#">Contacter l'administrateur</a>
      </div>
    </div>

    <footer class="footer">© 2025 ShifaTech. All rights reserved.</footer>
  </div>
</div>
