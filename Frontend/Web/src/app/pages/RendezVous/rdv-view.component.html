<app-page-breadcrumb pageTitle="Détails Rendez Vous" />

<div>
  <app-component-card title="Détails Rendez Vous">
    <ng-container *ngIf="rdv">
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <div>
          <app-label>Patient</app-label>
          <div class="flex items-center gap-3">
            <div
              class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-full border border-gray-100 bg-gray-50 dark:border-white/10 dark:bg-white/5"
            >
              <img
                *ngIf="patientIcon"
                [src]="patientIcon"
                [alt]="patientLabel"
                class="h-full w-full object-cover"
                (error)="$any($event.target).src = 'assets/images/user/user-01.png'"
              />
              <span *ngIf="!patientIcon" class="text-xs font-semibold text-gray-400">{{ patientInitials }}</span>
            </div>
            <div class="text-sm font-medium text-gray-800 dark:text-white/90">
              {{ patientLabel }}
            </div>
          </div>
        </div>

        <div>
          <app-label>Docteur</app-label>
          <div class="flex items-center gap-3">
            <div
              class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-full border border-gray-100 bg-gray-50 dark:border-white/10 dark:bg-white/5"
            >
              <img
                *ngIf="doctorIcon"
                [src]="doctorIcon"
                [alt]="doctorLabel"
                class="h-full w-full object-cover"
                (error)="$any($event.target).src = 'assets/img/user-grey.png'"
              />
              <span *ngIf="!doctorIcon" class="text-xs font-semibold text-gray-400">{{ doctorInitials }}</span>
            </div>
            <div class="text-sm font-medium text-gray-800 dark:text-white/90">
              {{ doctorLabel }}
            </div>
          </div>
        </div>

        <div>
          <app-label>Date</app-label>
          <div class="text-sm text-gray-800 dark:text-white/90">
            {{ rdvSlotLabel }}
          </div>
        </div>

        <div>
          <app-label>Status</app-label>
          <div class="text-sm text-gray-800 dark:text-white/90">
            {{ rdv.status ?? rdv.statut }}
          </div>
        </div>
      </div>
    </ng-container>
  </app-component-card>
</div>
