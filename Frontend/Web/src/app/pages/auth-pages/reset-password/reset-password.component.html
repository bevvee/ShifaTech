<div class="relative min-h-screen flex items-center justify-center px-4 overflow-hidden bg-slate-50">
    <!-- ===== MEDICAL ANIMATED BACKGROUND ===== -->
    <div class="absolute inset-0 medical-bg"></div>

    <!-- ===== CONTENT WRAPPER ===== -->
    <div class="relative z-10 w-full flex flex-col items-center">
        <!-- Brand -->
        <div class="flex items-center gap-2 mb-2 select-none cursor-pointer" routerLink="/">
            <img src="images/logo/logo-icon.png" class="h-16 w-auto" alt="ShifaTech" />
            <span class="text-2xl font-semibold text-gray-800">
                <span class="text-blue-light-850">Shifa</span>
                <span class="text-green-400">Tech</span>
            </span>
        </div>

        <!-- Card -->
        <div
            class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-200 px-6 py-7 sm:px-8 sm:py-8 transition-all duration-300">
            <h2 class="text-base sm:text-2xl font-medium text-center text-gray-900">Nouveau mot de passe</h2>
            <p class="text-sm text-gray-500 mt-1 text-center">Entrez votre nouveau mot de passe ci-dessous</p>

            @if (errorMessage) {
            <div class="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center">
                {{ errorMessage }}
            </div>
            }

            @if (successMessage) {
            <div class="mt-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-lg text-sm text-center">
                {{ successMessage }}
            </div>
            }

            <form class="mt-6 space-y-4" (ngSubmit)="onSubmit()">
                <div>
                    <app-label for="newPassword">Nouveau mot de passe</app-label>
                    <div class="relative">
                        <app-input-field id="newPassword" name="newPassword" [type]="showPassword ? 'text' : 'password'"
                            placeholder="Nouveau mot de passe" [(value)]="newPassword" className="relative z-0 pr-11" />
                    </div>
                </div>

                <div class="mt-2">
                    <app-label for="confirmPassword">Confirmer mot de passe</app-label>
                    <div class="relative">
                        <app-input-field id="confirmPassword" name="confirmPassword"
                            [type]="showPassword ? 'text' : 'password'" placeholder="Confirmer mot de passe"
                            [(value)]="confirmPassword" className="relative z-0 pr-11" />

                        <button type="button" (click)="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-4 z-10 flex items-center text-gray-400 hover:text-gray-600"
                            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
                            @if (showPassword) {
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path d="M10.477 10.465a3 3 0 0 0 4.243 4.243" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path
                                    d="M9.88 5.093A10.38 10.38 0 0 1 12 4c5 0 9.27 3.11 11 8-0.657 1.86-1.732 3.375-3.11 4.5"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path
                                    d="M6.61 6.61C4.7 8.05 3.23 9.88 2 12c1.73 4.89 6 8 10 8 1.54 0 3.02-0.3 4.38-0.84"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            } @else {
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path d="M2 12s3.636-7 10-7 10 7 10 7-3.636 7-10 7S2 12 2 12Z" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            }
                        </button>
                    </div>
                </div>

                <button type="submit" [disabled]="isLoading"
                    class="w-full h-11 mt-4 rounded-lg bg-green-400 text-white font-medium hover:bg-green-500 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">
                    {{ isLoading ? 'Réinitialisation...' : 'Réinitialiser' }}
                </button>

                <div class="mt-4 text-center">
                    <a routerLink="/signin"
                        class="text-sm text-gray-600 hover:text-green-500 transition-colors cursor-pointer">
                        Retour à la connexion
                    </a>
                </div>
            </form>
        </div>

        <p class="text-sm text-gray-700 mt-6 text-center">Copyright © 2026 - ShifaTech</p>
    </div>
</div>
