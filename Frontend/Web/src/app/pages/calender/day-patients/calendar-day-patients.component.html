<div class="rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/3 lg:p-6">
  <div class="mb-4 flex items-center justify-between">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Patients du {{ dateKey || '-' }}
    </h3>
    <span class="text-xs text-gray-500 dark:text-gray-400">
      @if (isLoading) { Loading... } @else { {{ patients.length }} patient(s) }
    </span>
  </div>

  @if (!isLoading && patients.length === 0) {
    <p class="text-sm text-gray-500 dark:text-gray-400">Aucun rendez-vous trouvé pour ce jour.</p>
  }

  <div class="space-y-2">
    @for (p of patients; track $index) {
      <div class="flex items-center justify-between rounded-xl border border-gray-200 bg-white px-3 py-2 dark:border-gray-800 dark:bg-white/3">
        <div class="flex min-w-0 items-center gap-3">
          <img [src]="p.avatarUrl" [alt]="p.patientName" class="h-9 w-9 rounded-full object-cover" />
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-800 dark:text-white/90">{{ p.patientName }}</p>
          </div>
        </div>
        <div class="shrink-0 text-xs font-medium text-gray-700 dark:text-gray-300">
          {{ p.times }}
        </div>
      </div>
    }
  </div>
</div>
