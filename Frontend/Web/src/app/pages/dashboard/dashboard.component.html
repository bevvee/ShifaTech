<div class="grid grid-cols-12 gap-4 md:gap-6">
  <div class="col-span-12 space-y-6 xl:col-span-7">
    <div><app-ecommerce-metrics /></div>

    <div *ngIf="(role$ | async) === Role.ADMIN">
      <app-monthly-sales-chart />
    </div>

  </div>

  @if ((role$ | async) === Role.DOCTEUR) {
    <div class="col-span-12 space-y-6 xl:col-span-5">
      <app-upcoming-appointments />
    </div>
  }

  @if ((role$ | async) === Role.SECRETAIRE) {
    <div class="col-span-12 space-y-6 xl:col-span-5">
      <app-appointment-requests />
    </div>
  }

  <div *ngIf="(role$ | async) === Role.ADMIN" class="col-span-12 space-y-6 xl:col-span-5">
    <app-top-services></app-top-services>
  </div>

  <div *ngIf="(role$ | async) === Role.DOCTEUR" class="col-span-12">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-6 xl:grid-cols-3">
      <app-availability />
      <app-appointment-statistics />
      <app-top-patients />
    </div>
  </div>
</div>
