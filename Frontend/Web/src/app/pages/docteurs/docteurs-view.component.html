<div class="px-2 pb-4">
  <app-page-breadcrumb pageTitle="Docteurs" />

  <app-component-card title="Détails du docteur">
    @if (doctor) {
      <div class="mt-2 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <app-label>Nom</app-label>
          <app-input-field [disabled]="true" [(value)]="doctor.nom" />
        </div>
        <div>
          <app-label>Prénom</app-label>
          <app-input-field [disabled]="true" [(value)]="doctor.prenom" />
        </div>
        <div>
          <app-label>Email</app-label>
          <app-input-field [disabled]="true" [(value)]="doctor.email" />
        </div>
        <div>
          <app-label>Numéro d'ordre</app-label>
          <app-input-field [disabled]="true" [(value)]="doctor.numeroOrdre" />
        </div>
        <div>
          <app-label>Spécialité</app-label>
          <app-input-field [disabled]="true" [(value)]="doctor.specialiteLabel" />
        </div>
      </div>

      <div class="mt-8 flex items-center justify-end gap-3">
        <app-button size="sm" variant="outline" (btnClick)="close()">Fermer</app-button>
      </div>
    }
  </app-component-card>
</div>
