<div class="px-2 pb-4">
	<app-page-breadcrumb pageTitle="Dossiers Médicaux" />

	<app-component-card title="Liste des Dossiers Médicaux">
		<div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
			<div class="flex items-center justify-end flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 p-4">
				<label for="dossiers-search" class="sr-only">Search</label>
				<div class="relative">
					<div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
						<svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
							<path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
						</svg>
					</div>
					<input
						type="text"
						id="dossiers-search"
						name="dossiers-search"
						[(ngModel)]="searchTerm"
						class="block w-full max-w-96 ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
						placeholder="Search"
					/>
				</div>
			</div>

			@if (filteredDossiers.length === 0) {
				<div class="p-4 text-center text-sm text-body">Aucun dossier trouvé.</div>
			} @else {
				<table class="w-full text-sm text-left rtl:text-right text-body">
					<thead class="text-sm text-body bg-neutral-secondary-medium border-b border-t border-default-medium">
						<tr>
							<th scope="col" class="px-6 py-3 font-medium">N° Dossier</th>
							<th scope="col" class="px-6 py-3 font-medium">Patient</th>
							<th scope="col" class="px-6 py-3 font-medium">Groupe Sanguin</th>
							<th scope="col" class="px-6 py-3 font-medium">Poids/Taille</th>
							<th scope="col" class="px-6 py-3 font-medium">Status</th>
							<th scope="col" class="px-6 py-3 font-medium">Action</th>
						</tr>
					</thead>
					<tbody>
						@for (d of filteredDossiers; track d.id) {
							<tr class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium">
								<td class="px-6 py-4 font-semibold text-heading">{{ d.numDossier }}</td>
								<td class="px-6 py-4">{{ d.nomPatient }}</td>
								<td class="px-6 py-4">{{ d.groupeSanguin }}</td>
								<td class="px-6 py-4">{{ d.poids }}kg / {{ d.taille }}cm</td>
								<td class="px-6 py-4">
									<div class="flex items-center">
										<div class="h-2.5 w-2.5 rounded-full me-2" [ngClass]="{
											'bg-success': d.status === 'ACTIVE',
											'bg-warning': d.status === 'ARCHIVED',
											'bg-danger': d.status === 'DECEASED'
										}"></div>
										{{ d.status }}
									</div>
								</td>
								<td class="px-6 py-4">
									<div class="flex items-center gap-3">
										<button
											type="button"
											(click)="viewDossier(d.id)"
											class="inline-flex h-9 w-9 items-center justify-center rounded-base border border-default-medium bg-neutral-secondary-medium text-body hover:bg-neutral-tertiary-medium hover:text-heading"
										>
											<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
												<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
												<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
											</svg>
										</button>

										<button
											type="button"
											(click)="editDossier(d.id)"
											class="inline-flex h-9 w-9 items-center justify-center rounded-base border border-default-medium bg-neutral-secondary-medium text-fg-brand hover:bg-neutral-tertiary-medium"
										>
											<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
												<path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
												<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
											</svg>
										</button>

										<button
											type="button"
											(click)="deleteDossier(d.id)"
											class="inline-flex h-9 w-9 items-center justify-center rounded-base border border-default-medium bg-neutral-secondary-medium text-fg-danger hover:bg-neutral-tertiary-medium"
										>
											<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
												<path d="M3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
												<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
												<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
												<path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
												<path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
											</svg>
										</button>
									</div>
								</td>
							</tr>
						}
					</tbody>
				</table>
			}
		</div>
	</app-component-card>
</div>
