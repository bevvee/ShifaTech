<div class="px-2 pb-4">
  <app-page-breadcrumb pageTitle="Infirmiers" />

  <app-component-card [title]="title">
    <p class="text-sm leading-6 text-gray-500 dark:text-gray-400">
      Les champs marqués <span class="font-semibold text-error-500">*</span> sont requis.
    </p>

    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <app-label for="nom">Nom <span class="font-semibold text-error-500">*</span></app-label>
        <app-input-field id="nom" name="nom" placeholder="Nom" [(value)]="form.nom" [error]="submitted && !form.nom.trim()" />
      </div>
      <div>
        <app-label for="prenom">Prénom <span class="font-semibold text-error-500">*</span></app-label>
        <app-input-field id="prenom" name="prenom" placeholder="Prénom" [(value)]="form.prenom" [error]="submitted && !form.prenom.trim()" />
      </div>

      <div>
        <app-label for="cin">CIN <span class="font-semibold text-error-500">*</span></app-label>
        <app-input-field id="cin" name="cin" placeholder="CIN" [(value)]="form.cin" [error]="submitted && !form.cin.trim()" />
      </div>
      <div>
        <app-label for="email">Email <span class="font-semibold text-error-500">*</span></app-label>
        <app-input-field id="email" name="email" type="email" placeholder="email@..." [(value)]="form.email" [error]="submitted && !form.email.trim()" />
      </div>

      <div>
        <app-label for="mot_de_passe">
          Mot de passe
          @if (mode === 'create') { <span class="font-semibold text-error-500">*</span> }
        </app-label>
        <app-input-field
          id="mot_de_passe"
          name="mot_de_passe"
          type="password"
          placeholder="Mot de passe"
          [(value)]="form.password"
          [error]="submitted && mode === 'create' && !form.password.trim()"
          [hint]="mode === 'edit' ? 'Laisser vide pour ne pas changer.' : ''"
        />
      </div>

      <div>
        <app-label>Sexe</app-label>
        <app-select [options]="sexeOptions" [(value)]="form.sexe" [hasSearch]="false" />
      </div>

      <div>
        <app-label for="dateNaissance">Date de Naissance <span class="font-semibold text-error-500">*</span></app-label>
        <app-input-field id="dateNaissance" name="dateNaissance" type="date" [(value)]="form.dateNaissance" [error]="submitted && !form.dateNaissance.trim()" />
      </div>

      <div>
        <app-label>Spécialité <span class="font-semibold text-error-500">*</span></app-label>
        <app-select [options]="specialiteOptions" [(value)]="form.idSpecialite" [hasSearch]="false" />
      </div>

      <div>
        <app-label for="telephone">Téléphone <span class="font-semibold text-error-500">*</span></app-label>
        <app-input-field id="telephone" name="telephone" placeholder="Téléphone" [(value)]="form.telephone" [error]="submitted && !form.telephone.trim()" />
      </div>

      <div class="sm:col-span-2">
        <app-label for="adresse">Adresse</app-label>
        <app-text-area id="adresse" name="adresse" placeholder="Adresse" [(value)]="form.adresse" [rows]="3" />
      </div>

    </div>

    <div class="mt-8 flex items-center justify-end gap-3">
      <app-button size="sm" variant="outline" (btnClick)="cancel()">Annuler</app-button>
      <app-button size="sm" (btnClick)="save()" [disabled]="!isValid || loading">
        @if (loading) { Enregistrement... } @else { Enregistrer }
      </app-button>
    </div>
    <!-- <button (click)="testToast()">Test Toast</button> -->

  </app-component-card>
</div>
