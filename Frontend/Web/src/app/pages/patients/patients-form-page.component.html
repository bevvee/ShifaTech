<div class="px-2 pb-4">
	<app-page-breadcrumb pageTitle="Patients" />

	<app-component-card [title]="title">
		<p class="text-sm leading-6 text-gray-500 dark:text-gray-400">
			Les champs marqués <span class="font-semibold text-error-500">*</span> sont requis.
		</p>

		<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
			<!-- Personal Information -->
			<div class="sm:col-span-2 border-b border-default pb-2">
				<h3 class="text-base font-semibold text-heading">Informations Personnelles</h3>
			</div>

			<div>
				<app-label for="nom">Nom <span class="font-semibold text-error-500">*</span></app-label>
				<app-input-field id="nom" name="nom" placeholder="Ex: Amrani" [(value)]="form.nom" [error]="submitted && !form.nom.trim()" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label for="prenom">Prénom <span class="font-semibold text-error-500">*</span></app-label>
				<app-input-field id="prenom" name="prenom" placeholder="Ex: Omar" [(value)]="form.prenom" [error]="submitted && !form.prenom.trim()" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label for="cin">CIN <span class="font-semibold text-error-500">*</span></app-label>
				<app-input-field id="cin" name="cin" placeholder="Ex: BE123456" [(value)]="form.cin" [error]="submitted && !form.cin.trim()" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label>Sexe</app-label>
				<app-select [options]="sexeOptions" [(value)]="form.sexe" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label for="dateNaissance">Date de Naissance</app-label>
				<app-input-field id="dateNaissance" name="dateNaissance" type="date" [(value)]="form.dateNaissance" [disabled]="isReadOnly" />
			</div>

			<!-- Contact Information -->
			<div class="sm:col-span-2 border-b border-default pb-2 mt-4">
				<h3 class="text-base font-semibold text-heading">Contact</h3>
			</div>

			<div>
				<app-label for="email">Email</app-label>
				<app-input-field id="email" name="email" type="email" placeholder="email@exemple.com" [(value)]="form.email" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label for="telephone">Téléphone</app-label>
				<app-input-field id="telephone" name="telephone" placeholder="06XXXXXXXX" [(value)]="form.telephone" [disabled]="isReadOnly" />
			</div>

			<div class="sm:col-span-2">
				<app-label for="adresse">Adresse</app-label>
				<app-input-field id="adresse" name="adresse" placeholder="Adresse complète..." [(value)]="form.adresse" [disabled]="isReadOnly" />
			</div>

			<!-- Administrative Information -->
			<div class="sm:col-span-2 border-b border-default pb-2 mt-4">
				<h3 class="text-base font-semibold text-heading">Information Administrative</h3>
			</div>

			<div>
				<app-label>Assurance</app-label>
				<app-select [options]="assuranceOptions" [(value)]="form.assurance" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label for="numeroAssurance">N° Assurance <span class="font-semibold text-error-500">*</span></app-label>
				<app-input-field id="numeroAssurance" name="numeroAssurance" placeholder="N° de police/assurance" [(value)]="form.numeroAssurance" [error]="submitted && !form.numeroAssurance.trim()" [disabled]="isReadOnly" />
			</div>

			<div>
				<app-label>Statut</app-label>
				<app-select [options]="statutOptions" [(value)]="form.statutValue" [disabled]="isReadOnly" />
			</div>
		</div>

		<div class="mt-8 flex items-center justify-end gap-3">
			<app-button size="sm" variant="outline" (btnClick)="cancel()">
				@if (isReadOnly) { Fermer } @else { Annuler }
			</app-button>
			@if (!isReadOnly) {
				<app-button size="sm" (btnClick)="save()" [disabled]="!isValid">Enregistrer</app-button>
			}
		</div>
	</app-component-card>
</div>
