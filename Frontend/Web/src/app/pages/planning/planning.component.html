<div class="space-y-6">
  <app-page-breadcrumb pageTitle="Planning" />

  <div>
    <app-component-card title="Planning" desc="Gérez votre emploi du temps et vos horaires ici.">

      <div *ngIf="!isAuthReady" class="rounded-lg border border-gray-200 bg-white p-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200">
        Loading...
      </div>

      <div *ngIf="isAuthReady && !isDoctor" class="rounded-lg border border-gray-200 bg-white p-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200">
        Cette page est réservée uniquement aux docteurs.
      </div>

      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Horaires</h2>
          <div class="text-sm text-gray-500 dark:text-gray-400" *ngIf="doctorId != null">
            ID Docteur : {{ doctorId }}
          </div>
        </div>

        <!-- Day tabs -->
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            *ngFor="let d of days"
            (click)="setActiveDay(d.key)"
            class="rounded-lg px-4 py-2 text-sm font-semibold"
            [class.bg-brand-500]="activeDay === d.key"
            [class.text-white]="activeDay === d.key"
            [class.bg-gray-100]="activeDay !== d.key"
            [class.text-gray-800]="activeDay !== d.key"
            [class.dark:bg-white/10]="activeDay !== d.key"
            [class.dark:text-white]="activeDay !== d.key"
          >
            {{ d.label }}
          </button>
        </div>

        <!-- <div *ngIf="errorMessage" class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200">
          {{ errorMessage }}
        </div> -->

        <div *ngIf="isLoading" class="rounded-lg border border-gray-200 bg-white p-4 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200">
          Chargement du planning...
        </div>

        <div class="space-y-4" [class.opacity-60]="isFormDisabled">
          <!-- Row 1: Working hours -->
          <div class="grid grid-cols-1 gap-4 md:grid-cols-12">
            <div class="md:col-span-4">
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">Day</label>
              <input
                class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                [value]="activeDayLabel"
                readonly
              />
            </div>

            <div class="md:col-span-4">
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">From</label>
              <input
                type="time"
                class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                [(ngModel)]="activeForm.heureDebut"
                [disabled]="isFormDisabled"
              />
            </div>

            <div class="md:col-span-4">
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">To</label>
              <input
                type="time"
                class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                [(ngModel)]="activeForm.heureFin"
                [disabled]="isFormDisabled"
              />
            </div>
          </div>

          <!-- Row 2: Pause -->
          <div class="grid grid-cols-1 gap-4 md:grid-cols-12">
            <div class="md:col-span-4">
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">Pause</label>
              <input
                class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                value="Optional"
                readonly
              />
            </div>

            <div class="md:col-span-4">
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">From</label>
              <input
                type="time"
                class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                [(ngModel)]="activeForm.pauseDebut"
                [disabled]="isFormDisabled"
              />
            </div>

            <div class="md:col-span-4">
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">To</label>
              <input
                type="time"
                class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                [(ngModel)]="activeForm.pauseFin"
                [disabled]="isFormDisabled"
              />
            </div>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-gray-100 pt-4 dark:border-white/10">
          <button
            type="button"
            (click)="cancel()"
            [disabled]="isSaving"
            class="inline-flex h-11 items-center justify-center rounded-lg border border-gray-200 bg-white px-5 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 dark:border-white/10 dark:bg-white/3 dark:text-gray-200 dark:hover:bg-white/6"
          >
            Annuler
          </button>

          <button
            type="button"
            (click)="deleteSlot(activeDay)"
            *ngIf="formByDay[activeDay].idPlan"
            [disabled]="isSaving"
            class="inline-flex h-11 items-center justify-center rounded-lg border border-red-200 bg-white px-5 text-sm font-medium text-red-600 hover:bg-red-50 disabled:opacity-50 dark:border-red-500/30 dark:bg-white/3 dark:text-red-400 dark:hover:bg-red-500/10"
          >
            Vider la journée
          </button>

          <button
            type="button"
            (click)="saveChanges()"
            [disabled]="isFormDisabled"
            class="inline-flex h-11 items-center justify-center rounded-lg bg-brand-500 px-5 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50"
          >
            Enregistrer les modifications
          </button>
        </div>
      </div>
    </app-component-card>
  </div>
</div>
