<div class="space-y-6">
  <app-page-breadcrumb pageTitle="Planning" />

  <div>
    <app-component-card title="Planning" desc="Manage your planning and schedule here.">

      <div *ngIf="!isAuthReady" class="rounded-lg border border-gray-200 bg-white p-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200">
        Loading...
      </div>

      <div *ngIf="isAuthReady && !isDoctor && !isInfirmier" class="rounded-lg border border-gray-200 bg-white p-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200">
        This page is available for doctors only.
      </div>

      <div class="space-y-6">

        <!-- Nurse: doctor selector -->
        @if (isInfirmier) {
          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
              Sélectionner un Docteur
            </label>
            <select
              class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
              (change)="onDoctorChange(+$any($event.target).value)"
            >
              <option value="">-- Choisir un docteur --</option>
              @for (d of doctors; track d.idDocteur) {
                <option [value]="d.idDocteur">Dr {{ d.prenom }} {{ d.nom }}</option>
              }
            </select>
          </div>
        }

        <!-- Availability read-only card -->
        <div class="rounded-xl border border-gray-200 bg-white p-6 dark:border-white/10 dark:bg-white/3">
          <h2 class="mb-5 text-base font-bold text-gray-900 dark:text-white">Availability</h2>

          <div *ngIf="isLoading" class="text-sm text-gray-400 dark:text-gray-500">Loading...</div>

          <div *ngIf="!isLoading">
            <!-- Day headers row -->
            <div class="grid border-b border-gray-200 dark:border-white/10"
                 [style.grid-template-columns]="'repeat(' + days.length + ', 1fr)'">
              <div
                *ngFor="let d of days"
                class="pb-3 text-sm font-semibold text-gray-900 dark:text-white"
              >
                {{ d.label }}
              </div>
            </div>

            <!-- Slots row -->
            <div class="mt-4 grid items-start gap-y-2"
                 [style.grid-template-columns]="'repeat(' + days.length + ', 1fr)'">
              <div *ngFor="let d of days" class="flex flex-col gap-2 pr-3">
                <ng-container *ngIf="formByDay[d.key].heureDebut && formByDay[d.key].heureFin; else emptyDay">
                  <!-- Work slot -->
                  <span class="w-fit rounded-lg bg-brand-500/10 px-3 py-1.5 text-xs font-semibold text-brand-600 dark:bg-brand-500/20 dark:text-brand-400 whitespace-nowrap">
                    {{ formByDay[d.key].heureDebut }} - {{ formByDay[d.key].heureFin }}
                  </span>
                  <!-- Pause slot -->
                  <span
                    *ngIf="formByDay[d.key].pauseDebut && formByDay[d.key].pauseFin"
                    class="w-fit rounded-lg bg-orange-500/10 px-3 py-1.5 text-xs font-semibold text-orange-600 dark:bg-orange-500/20 dark:text-orange-400 whitespace-nowrap"
                  >
                    Pause: {{ formByDay[d.key].pauseDebut }} - {{ formByDay[d.key].pauseFin }}
                  </span>
                </ng-container>
                <ng-template #emptyDay>
                  <span class="text-xs text-gray-400 dark:text-gray-600">—</span>
                </ng-template>
              </div>
            </div>
          </div>
        </div>

        <!-- Edit form (doctors only) -->
        <div *ngIf="isDoctor" class="rounded-xl border border-gray-200 bg-white p-6 dark:border-white/10 dark:bg-white/3">
          <h3 class="mb-5 text-sm font-semibold text-gray-700 dark:text-gray-200">
            Modifier — {{ activeDayLabel }}
          </h3>

          <!-- Day tabs -->
          <div class="mb-5 flex gap-4 border-b border-gray-200 dark:border-white/10 overflow-x-auto">
            <button
              type="button"
              *ngFor="let d of days"
              (click)="setActiveDay(d.key)"
              class="whitespace-nowrap pb-3 text-sm font-medium transition-colors"
              [class.border-b-2]="activeDay === d.key"
              [class.border-brand-500]="activeDay === d.key"
              [class.text-brand-600]="activeDay === d.key"
              [class.dark:text-brand-400]="activeDay === d.key"
              [class.text-gray-500]="activeDay !== d.key"
              [class.dark:text-gray-400]="activeDay !== d.key"
            >
              {{ d.label }}
            </button>
          </div>

          <div class="space-y-4" [class.opacity-60]="isFormDisabled">
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">De</label>
                <input type="time"
                  class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                  [(ngModel)]="activeForm.heureDebut" [disabled]="isFormDisabled" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">À</label>
                <input type="time"
                  class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                  [(ngModel)]="activeForm.heureFin" [disabled]="isFormDisabled" />
              </div>
            </div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
                  Pause <span class="font-normal text-gray-400">(optionnel)</span>
                </label>
                <input type="time"
                  class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                  [(ngModel)]="activeForm.pauseDebut" [disabled]="isFormDisabled" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">&nbsp;</label>
                <input type="time"
                  class="h-11 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
                  [(ngModel)]="activeForm.pauseFin" [disabled]="isFormDisabled" />
              </div>
            </div>
          </div>

          <div class="mt-6 flex items-center justify-end gap-3 border-t border-gray-100 pt-4 dark:border-white/10">
            <button type="button" (click)="cancel()" [disabled]="isSaving"
              class="inline-flex h-11 items-center justify-center rounded-lg border border-gray-200 bg-white px-5 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 dark:border-white/10 dark:bg-white/3 dark:text-gray-200">
              Annuler
            </button>
            <button type="button" (click)="saveChanges()" [disabled]="isFormDisabled"
              class="inline-flex h-11 items-center justify-center rounded-lg bg-brand-500 px-5 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50">
              Enregistrer
            </button>
          </div>
        </div>

      </div>
    </app-component-card>
  </div>
</div>
