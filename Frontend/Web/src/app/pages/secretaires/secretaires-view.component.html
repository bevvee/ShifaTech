<div class="px-2 pb-4">
  <app-page-breadcrumb pageTitle="Secretaires" />

  <app-component-card title="Détails de la secretaire">
    @if (secretaire) {
      <div class="mt-2 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <app-label>Nom</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.nom" />
        </div>
        <div>
          <app-label>Prénom</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.prenom" />
        </div>
        <div>
          <app-label>CIN</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.cin" />
        </div>
        <div>
          <app-label>Email</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.email" />
        </div>
        <div>
          <app-label>Sexe</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.sexe" />
        </div>
        <div>
          <app-label>Statut</app-label>
          <app-input-field [disabled]="true" [value]="secretaire.statut ? 'Actif' : 'Inactif'" />
        </div>
        <div>
          <app-label>Date de naissance</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.dateNaissance" />
        </div>
        <div>
          <app-label>Téléphone</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.telephone" />
        </div>
        <div class="sm:col-span-2">
          <app-label>Adresse</app-label>
          <app-input-field [disabled]="true" [(value)]="secretaire.adresse" />
        </div>
      </div>

      <div class="mt-8 flex items-center justify-end gap-3">
        <app-button size="sm" variant="outline" (btnClick)="close()">Fermer</app-button>
      </div>
    }
  </app-component-card>
</div>
