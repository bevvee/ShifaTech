<div class="px-2 pb-4">
  <app-page-breadcrumb pageTitle="Services" />

  <app-component-card title="Détails du service">
    @if (service) {
      <div class="mt-2 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <app-label>Nom</app-label>
          <app-input-field [disabled]="true" [(value)]="service.label" />
        </div>

        <div class="sm:col-span-2">
          <app-label>Description</app-label>
          <app-text-area [disabled]="true" [(value)]="service.description" [rows]="3" />
        </div>
      </div>

      <div class="mt-8 flex items-center justify-end gap-3">
        <app-button size="sm" variant="outline" (btnClick)="close()">Fermer</app-button>
      </div>
    }
  </app-component-card>
</div>
