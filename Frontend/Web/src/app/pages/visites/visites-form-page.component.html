<div class="px-2 pb-4">
    <app-page-breadcrumb pageTitle="Visite" />

    <app-component-card [title]="title">
        <div class="flex flex-col gap-3 mb-4 sm:flex-row sm:items-center sm:justify-between">
            <p class="text-sm leading-6 text-gray-500 dark:text-gray-400">
                Les champs marqués <span class="font-semibold text-error-500">*</span> sont requis.
            </p>
            <ng-container *ngIf="isReadOnly && (userRole$ | async) === Role.DOCTEUR">
                <app-button size="sm" variant="outline" className="w-full sm:w-auto" (btnClick)="generateOrdonnance()">
                    <svg class="w-4 h-4 me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Générer Ordonnance
                </app-button>
            </ng-container>
        </div>

        <div class="mt-6 grid grid-cols-1 gap-4 lg:grid-cols-2">
            <div>
                <app-label>Dossier Médical <span class="font-semibold text-error-500">*</span></app-label>
                <app-select [options]="dossierOptions" [(value)]="form.idDossier"
                    [hasSearch]="dossierOptions.length > 1"
                    [disabled]="isReadOnly || mode === 'edit' || (mode === 'create' && dossierOptions.length === 1)" />
            </div>

            <div>
                <app-label>Status</app-label>
                <app-select [options]="statusOptions" [(value)]="form.status" [hasSearch]="false"
                    [disabled]="isReadOnly" />
            </div>

            <div>
                <app-label>Type de Visite <span class="font-semibold text-error-500">*</span></app-label>
                <app-select [options]="typeVisiteOptions" [(value)]="form.typeVisite" [hasSearch]="false"
                    [disabled]="isReadOnly" />
            </div>

            <ng-container *ngIf="form.typeVisite === 'BLESSURE'">
                <div>
                    <app-label>Genre de Blessure <span class="font-semibold text-error-500">*</span></app-label>
                    <app-select [options]="typeBlessureOptions" [(value)]="form.typeBlessure" [hasSearch]="false"
                        [disabled]="isReadOnly" />
                </div>

                <div class="col-span-1 lg:col-span-2 wound-layout">

                    <!-- LEFT: BODY -->
                    <div class="wound-layout__main">
                        <app-label>Zones Corporelles Affectées</app-label>
                        <app-body-map [selectedCodes]="form.bodyParts" [readOnly]="isReadOnly"
                            [showOnlySelected]="isReadOnly" (selectionChange)="form.bodyParts = $event"
                            (selectionLabelsChange)="selectedBodyPartLabels = $event"
                            (firstPartIdChange)="form.idBodyPart = $event" />
                    </div>

                    <!-- RIGHT: IMAGE -->
                    <div class="wound-layout__side">
                        <app-label>Image de plaie</app-label>

                        <div class="wound-upload-section" [class.is-empty]="!woundImagePreviewUrl"
                            (click)="onWoundImageBoxClick()">

                            <!-- ✅ ADD THIS INPUT HERE -->
                            <input id="woundImageInput" type="file" accept="image/*" style="display: none"
                                (change)="onWoundImageSelected($event)" />

                            <!-- PREVIEW -->
                            <div class="wound-preview" *ngIf="woundImagePreviewUrl">
                                <img [src]="woundImagePreviewUrl" />
                            </div>

                            <div class="wound-preview wound-preview--empty" *ngIf="!woundImagePreviewUrl">
                                <span>Aucune image</span>
                            </div>

                            <!-- BUTTON -->
                            <app-button size="sm" variant="outline"
                                (btnClick)="triggerWoundImageUpload(); $event.stopPropagation()"
                                [disabled]="isReadOnly">
                                Charger image
                            </app-button>

                        </div>
                    </div>
                </div>

                <div class="col-span-1 lg:col-span-2" *ngIf="showWoundAnalysis && woundImageObjectName && id">
                    <app-wound-analysis
                        [visitId]="id"
                        [imageName]="woundImageObjectName"
                        [autoAnalyze]="true"
                        [localisation]="selectedBodyPartLabels.join(', ')"
                        (analysisReady)="onWoundAnalysisReady($event)"
                    />
                </div>

                <!-- ✅ NOW BELOW BODY -->
                <div class="col-span-1 lg:col-span-2" *ngIf="isReadOnly && (viewOriginalImageUrl || viewOverlayUrl || viewMaskUrl)">

                    <div class="images-section">
                        <h3 class="images-title">Visualisation</h3>

                        <div class="images-grid">
                            <!-- <div *ngIf="viewOriginalImageUrl" class="image-container">
                                <h4>Image originale</h4>
                                <img [src]="woundAnalysisService.getImageUrl(viewOriginalImageUrl)" />
                            </div> -->
                            <div *ngIf="viewOverlayUrl" class="image-container">
                                <h4>Détection</h4>
                                <img [src]="woundAnalysisService.getImageUrl(viewOverlayUrl)" />
                            </div>

                            <div *ngIf="viewMaskUrl" class="image-container">
                                <h4>Masque</h4>
                                <img [src]="woundAnalysisService.getImageUrl(viewMaskUrl)" />
                            </div>

                        </div>
                    </div>
                </div>
            </ng-container>

            <div>
                <app-label for="traitement">Plan de Traitement <span
                        class="font-semibold text-error-500">*</span></app-label>
                <app-text-area id="traitement" name="traitement" placeholder="Prescription, soins à prodiguer..."
                    [(value)]="form.planTraitement" [rows]="5" [error]="submitted && !form.planTraitement.trim()"
                    [disabled]="isReadOnly" />
            </div>

            <div>
                <app-label for="observations">Observations</app-label>
                <app-text-area id="observations" name="observations" placeholder="Remarques cliniques..."
                    [(value)]="form.observations" [rows]="5" [disabled]="isReadOnly" />
            </div>
        </div>

        <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-end">
            <app-button size="sm" variant="outline" (btnClick)="cancel()">
                <span *ngIf="isReadOnly; else cancelLabel">Fermer</span>
                <ng-template #cancelLabel>Annuler</ng-template>
            </app-button>
            <app-button *ngIf="!isReadOnly" size="sm" (btnClick)="save()" [disabled]="!isValid">Enregistrer</app-button>
        </div>
    </app-component-card>
</div>
