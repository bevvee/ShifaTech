<div class="px-2 pb-4">
	<app-page-breadcrumb pageTitle="Visites" />

	<app-component-card title="Visites">
		<ng-container>
				<span
					card-title-addon
					class="inline-flex items-center rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-green-700 dark:bg-white/10 dark:text-white/80"
				>
					<span class="text-blue-600 px-3">Total : </span> {{ filteredVisites.length }}
				</span>

				<div card-actions class="relative inline-flex items-center gap-2">
					<label for="visites-search" class="sr-only">Search</label>
					<div class="relative">
						<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
							<svg class="h-4 w-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
								<path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
							</svg>
						</div>
						<input
							type="text"
							id="visites-search"
							name="visites-search"
							[(ngModel)]="searchTerm"
							class="h-10 w-72 rounded-lg border border-gray-200 bg-white pl-9 pr-3 text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
							placeholder="Search"
						/>
					</div>
				</div>
				<div class="overflow-hidden rounded-xl border border-gray-200 bg-white dark:border-white/10 dark:bg-white/3">
					<div class="max-w-full overflow-x-auto">
						<table class="min-w-full">
							<thead class="border-b border-gray-200 dark:border-white/10">
								<tr>
									<th class="px-5 py-3 text-left text-sm font-medium text-gray-500">Date/Heure</th>
									<th class="px-5 py-3 text-left text-sm font-medium text-gray-500">Patient</th>
									<th class="px-5 py-3 text-left text-sm font-medium text-gray-500">Dossier</th>
									<th class="px-5 py-3 text-left text-sm font-medium text-gray-500">Status</th>
									<th class="px-5 py-3 text-left text-sm font-medium text-gray-500">Actions</th>
								</tr>
							</thead>

							<tbody>
								@if (filteredVisites.length === 0) {
									<tr class="border-b border-gray-200 dark:border-white/10">
										<td colspan="5" class="p-6 text-center text-sm text-gray-500 dark:text-gray-400">Aucune visite.</td>
									</tr>
								} @else {
									@for (v of filteredVisites; track v.id) {
										<tr class="border-b border-gray-200 dark:border-white/10">
											<td class="px-5 py-4 font-medium text-gray-800 dark:text-white">{{ v.dateCreation | date:'dd/MM/yyyy HH:mm' }}</td>
											<td class="px-5 py-4 text-gray-700 dark:text-gray-300">{{ v.nomPatient }}</td>
											<td class="px-5 py-4 text-gray-700 dark:text-gray-300">{{ v.numDossier }}</td>
											<td class="px-5 py-4">
												<div class="flex items-center text-gray-700 dark:text-gray-300">
													<div
														class="mr-2 h-2.5 w-2.5 rounded-full"
														[ngClass]="{
															'bg-success-500': v.status === 'OPEN',
															'bg-gray-400 dark:bg-white/20': v.status === 'CLOSED',
															'bg-error-500': v.status === 'CANCELLED'
														}"
													></div>
													{{ v.status }}
												</div>
											</td>
											<td class="px-5 py-4">
												<div class="flex items-center gap-3">
													<button
														type="button"
														(click)="viewVisite(v.id)"
														class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 dark:border-white/10 dark:bg-white/3 dark:text-gray-200 dark:hover:bg-white/6"
														aria-label="Voir"
													>
														<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
															<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
															<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
														</svg>
													</button>

													<button
														type="button"
														(click)="editVisite(v.id)"
														class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-green-600 hover:bg-gray-50 dark:border-white/10 dark:bg-white/3 dark:text-green-400 dark:hover:bg-white/6"
														aria-label="Modifier"
													>
														<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
															<path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
															<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
														</svg>
													</button>

													<button
														type="button"
														(click)="deleteVisite(v.id)"
														class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-red-600 hover:bg-gray-50 dark:border-white/10 dark:bg-white/3 dark:text-red-400 dark:hover:bg-white/6"
														aria-label="Supprimer"
													>
														<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
															<path d="M3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
															<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
															<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
															<path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
															<path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
														</svg>
													</button>
												</div>
											</td>
										</tr>
									}
								}
							</tbody>
						</table>
					</div>
				</div>
		</ng-container>
	</app-component-card>
</div>
