<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-white/3 md:p-6">
  <div class="mb-5 flex items-center justify-between gap-3">
    <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Appointment Request</h3>

    <a
      routerLink="/rendez-vous"
      class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
    >
      All Appointments
    </a>
  </div>

  <div *ngIf="isLoading" class="flex items-center justify-center py-8">
    <p class="text-sm text-slate-500 dark:text-slate-400">Loading appointment requests...</p>
  </div>

  <div *ngIf="!isLoading && visibleRequests.length === 0" class="flex items-center justify-center py-8">
    <p class="text-sm text-slate-500 dark:text-slate-400">No pending requests</p>
  </div>

  <div *ngIf="!isLoading && visibleRequests.length > 0" class="custom-scrollbar max-h-60 overflow-y-auto pr-2">
    <div *ngFor="let request of visibleRequests; let last = last" class="border-b border-slate-200 py-3 last:border-b-0 dark:border-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-xs font-bold text-slate-700 dark:bg-slate-800 dark:text-slate-200">
          {{ request.patientName.charAt(0) }}
        </div>

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold leading-5 text-slate-900 dark:text-white">{{ request.patientName }}</p>
          <div class="mt-0.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500 dark:text-slate-400">
            <span class="inline-flex items-center gap-1">
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              {{ request.dateLabel }}
            </span>
            <span class="inline-flex items-center gap-1">
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m9-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              {{ request.timeLabel }}
            </span>
          </div>
        </div>

        <div class="hidden shrink-0 md:block">
          <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-semibold" [ngClass]="request.badgeClass">
            {{ request.specialtyLabel }}
          </span>
        </div>

        <div class="flex shrink-0 items-center gap-1.5">
          <button
            type="button"
            class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-slate-500 transition hover:bg-slate-200 hover:text-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white"
            aria-label="Reject request"
            title="Reject"
          >
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>

          <button
            type="button"
            class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-slate-500 transition hover:bg-slate-200 hover:text-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white"
            aria-label="Confirm request"
            title="Confirm"
          >
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
