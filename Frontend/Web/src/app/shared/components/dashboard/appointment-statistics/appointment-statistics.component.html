<div class="flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/3 md:p-5">
  <div class="mb-6 flex items-center justify-between gap-3">
    <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">Appointment Statistics</h3>
    <button
      type="button"
      class="inline-flex h-8 shrink-0 items-center rounded-lg border border-gray-200 bg-white px-3 text-xs font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-dark dark:text-gray-300"
    >
      Monthly ▼
    </button>
  </div>

  <div class="flex flex-1 flex-col items-center justify-center">
    <div class="w-full">
      <apx-chart [series]="series" [chart]="chart" [colors]="colors" [labels]="labels" [plotOptions]="plotOptions" [legend]="legend" [dataLabels]="dataLabels"></apx-chart>
    </div>

    <div class="mt-3 flex flex-wrap items-center justify-center gap-4">
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-success-500"></span>
        <span class="text-xs text-gray-500 dark:text-gray-400">Completed</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-warning-500"></span>
        <span class="text-xs text-gray-500 dark:text-gray-400">Pending</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-error-500"></span>
        <span class="text-xs text-gray-500 dark:text-gray-400">Cancelled</span>
      </div>
    </div>

    <div class="mt-4 grid w-full grid-cols-3 gap-4 border-t border-gray-100 pt-4 dark:border-gray-800">
      <div class="text-center">
        <div class="text-lg font-semibold text-gray-800 dark:text-white/90">260</div>
        <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">Completed</div>
      </div>
      <div class="text-center">
        <div class="text-lg font-semibold text-gray-800 dark:text-white/90">21</div>
        <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">Pending</div>
      </div>
      <div class="text-center">
        <div class="text-lg font-semibold text-gray-800 dark:text-white/90">50</div>
        <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">Cancelled</div>
      </div>
    </div>
  </div>
</div>
