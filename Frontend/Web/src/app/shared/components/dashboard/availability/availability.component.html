<div class="flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/3 md:p-5">
  <div class="mb-6 flex items-center justify-between gap-3">
    <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">Availability</h3>
    <button
      type="button"
      class="inline-flex h-8 shrink-0 items-center rounded-lg border border-gray-200 bg-white px-3 text-xs font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-dark dark:text-gray-300"
    >
      {{ clinic }} ▼
    </button>
  </div>

  <div class="flex-1 divide-y divide-gray-100 dark:divide-gray-800">
    <div *ngFor="let slot of slots" class="flex items-center justify-between gap-3 py-2.5">
      <span class="w-12 shrink-0 text-sm font-medium text-gray-800 dark:text-white/90">{{ slot.day }}</span>

      <div class="flex min-w-0 items-center justify-end gap-2 text-xs text-gray-500 dark:text-gray-400">
        <svg *ngIf="!slot.isClosed" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 2m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <svg *ngIf="slot.isClosed" class="h-4 w-4 shrink-0 text-error-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>

        <span class="whitespace-nowrap" [class.text-error-500]="slot.isClosed">{{ slot.time }}</span>
      </div>
    </div>
  </div>

  <button
    type="button"
    class="mt-5 w-full rounded-lg bg-gray-100 px-4 py-2 text-xs font-medium text-gray-700 hover:bg-gray-200 dark:bg-gray-dark dark:text-gray-300 dark:hover:bg-gray-800"
  >
    Edit Availability
  </button>
</div>
