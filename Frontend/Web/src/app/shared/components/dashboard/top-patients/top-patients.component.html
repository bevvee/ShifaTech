<div class="flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/3 md:p-5">
  <div class="mb-6 flex items-center justify-between gap-3">
    <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">Top Patients</h3>
    <button
      type="button"
      class="inline-flex h-8 shrink-0 items-center rounded-lg border border-gray-200 bg-white px-3 text-xs font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-dark dark:text-gray-300"
    >
      Weekly ▼
    </button>
  </div>

  <div class="flex-1 divide-y divide-gray-100 dark:divide-gray-800">
    <div *ngFor="let patient of patients; let i = index" class="flex items-center justify-between gap-4 py-3">
      <div class="flex min-w-0 items-center gap-3">
        <div [class]="'flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-xs font-semibold text-white ' + getAvatarColor(i)">
          {{ patient.avatar }}
        </div>

        <div class="min-w-0">
          <div class="truncate text-sm font-medium text-gray-800 dark:text-white/90">{{ patient.name }}</div>
          <div class="mt-0.5 truncate text-xs text-gray-500 dark:text-gray-400">{{ patient.phone }}</div>
        </div>
      </div>

      <button
        type="button"
        class="shrink-0 rounded-full border border-brand-500 px-3 py-1 text-xs font-medium text-brand-500 hover:bg-brand-50 dark:border-brand-400 dark:text-brand-400 dark:hover:bg-brand-500/10"
      >
        {{ patient.appointments }} Appointments
      </button>
    </div>
  </div>
</div>
