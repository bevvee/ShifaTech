<div class="flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/3 md:p-5">
  <div class="mb-4 flex items-center justify-between gap-3">
    <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">Services</h3>
    <span class="inline-flex items-center rounded-lg bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700 dark:bg-blue-900/20 dark:text-blue-400">
      {{ services.length }}
    </span>
  </div>

  <div *ngIf="isLoading" class="flex min-h-40 items-center justify-center text-sm text-gray-500 dark:text-gray-400">
    Loading services...
  </div>

  <div *ngIf="!isLoading && error" class="flex min-h-40 items-center justify-center text-sm text-red-500 dark:text-red-400">
    {{ error }}
  </div>

  <div *ngIf="!isLoading && services.length === 0" class="flex min-h-40 items-center justify-center text-sm text-gray-500 dark:text-gray-400">
    No services available.
  </div>

  <div *ngIf="!isLoading && services.length > 0" class="space-y-3 overflow-y-auto">
    <div *ngFor="let service of services" class="rounded-lg border border-gray-100 bg-gray-50/50 p-3 dark:border-gray-700 dark:bg-gray-800/50">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1">
          <h4 class="text-sm font-medium text-gray-900 dark:text-white">{{ service.label }}</h4>
          <p *ngIf="service.description" class="mt-1 line-clamp-2 text-xs text-gray-600 dark:text-gray-400">
            {{ service.description }}
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
