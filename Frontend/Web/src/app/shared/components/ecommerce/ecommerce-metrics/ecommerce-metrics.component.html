<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6">
  <div
    *ngFor="let metric of metrics"
    class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/3 md:p-6"
  >
    <div class="flex items-center gap-4">
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl"
        [ngClass]="getMetricColorClasses(metric.key)"
        [innerHTML]="metric.icon | safeHtml"
      ></div>

      <div class="min-w-0">
        <div class="text-sm text-gray-500 dark:text-gray-400 truncate">
          {{ metric.label }}
        </div>

        <div class="mt-1 font-bold text-gray-800 text-title-sm dark:text-white/90">
          {{ metric.value }}
        </div>
      </div>
    </div>
  </div>
</div>
