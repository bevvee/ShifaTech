<div>
  @if (label) {
    <app-label [for]="id">{{ label }}</app-label>
  }

  <div class="relative inline-block w-full">
    <!-- Trigger Button -->
    <button
      type="button"
      (click)="togglePicker()"
      class="flex w-full items-center gap-2 bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-700 shadow-sm hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300 transition"
    >
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <span class="flex-1 text-left">{{ selectedDateLabel }}</span>
      <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Dropdown Card -->
    @if (isOpen) {
      <div class="absolute z-50 mt-2 bg-white rounded-xl shadow-lg border border-gray-200 p-3 w-64">
        <!-- Header: Month + Nav -->
        <div class="flex items-center justify-between mb-2">
          <button
            type="button"
            (click)="changeMonth(-1)"
            class="p-1 rounded hover:bg-gray-100 text-gray-500 hover:text-gray-700 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>

          <span class="text-sm font-semibold text-gray-700">{{ monthLabel }}</span>

          <button
            type="button"
            (click)="changeMonth(1)"
            class="p-1 rounded hover:bg-gray-100 text-gray-500 hover:text-gray-700 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- Day Names -->
        <div class="grid grid-cols-7 mb-1">
          @for (name of dayNames; track $index) {
            <div class="text-center text-xs text-gray-400 font-medium py-1">{{ name }}</div>
          }
        </div>

        <!-- Days Grid -->
        <div class="grid grid-cols-7 gap-y-0.5">
          @for (cell of dayCells; track $index) {
            @if (cell === null) {
              <div></div>
            } @else {
              <div
                [class]="dayClass(cell)"
                (click)="selectDay(cell)"
              >
                {{ cell }}
              </div>
            }
          }
        </div>

        <!-- Footer: Today button -->
        <div class="mt-2 pt-2 border-t border-gray-100 text-center">
          <button
            type="button"
            (click)="goToToday()"
            class="text-xs text-blue-500 hover:text-blue-700 font-medium transition"
          >
            Today
          </button>
        </div>
      </div>
    }
  </div>
</div>
