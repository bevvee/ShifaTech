<div
  class="overflow-hidden rounded-xl border border-gray-200 bg-white dark:border-white/10 dark:bg-white/3"
>
  <div class="max-w-full overflow-x-auto">
    <table class="min-w-full">
      <thead class="border-b border-gray-200 dark:border-white/10">
        <tr>
          <th class="px-5 py-3 text-left text-sm font-medium text-gray-500">
            Patient
          </th>

          <th class="px-5 py-3 text-left text-sm font-medium text-gray-500">
            Médecin
          </th>

          <th class="px-5 py-3 text-left text-sm font-medium text-gray-500">
            Date
          </th>

          <th class="px-5 py-3 text-left text-sm font-medium text-gray-500">
            Heure
          </th>

          <th class="px-5 py-3 text-left text-sm font-medium text-gray-500">
            Status
          </th>

          <th class="px-5 py-3 text-left text-sm font-medium text-gray-500">
            Actions
          </th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let item of currentItems"
          class="border-b border-gray-200 dark:border-white/10"
        >
          <!-- Patient -->
          <td class="px-5 py-4">
            <div class="flex items-center gap-3">
              <img
                src="https://i.pravatar.cc/40"
                class="w-10 h-10 rounded-full object-cover"
              />

              <div>
                <p class="font-medium text-gray-800 dark:text-white">
                  {{ item.patient }}
                </p>

                <p class="text-sm text-gray-500">Patient ID {{ item.id }}</p>
              </div>
            </div>
          </td>

          <!-- Doctor -->
          <td class="px-5 py-4">
            <div class="flex items-center gap-3">
              <img
                src="https://i.pravatar.cc/41"
                class="w-10 h-10 rounded-full object-cover"
              />

              <div>
                <p class="font-medium text-gray-800 dark:text-white">
                  {{ item.medecin }}
                </p>

                <p class="text-sm text-gray-500">Médecin</p>
              </div>
            </div>
          </td>

          <!-- Date -->
          <td class="px-5 py-4 text-gray-700 dark:text-gray-300">
            {{ item.date }}
          </td>

          <!-- Heure -->
          <td class="px-5 py-4 text-gray-700 dark:text-gray-300">
            {{ item.heure }}
          </td>

          <!-- Status -->
          <td class="px-5 py-4">
            <app-badge [color]="getBadgeColor(item.statut)">
              {{ item.statut }}
            </app-badge>
          </td>

          <!-- Actions -->
          <td class="px-5 py-4">
            <div class="flex items-center gap-3">
              <button
                type="button"
                (click)="handleViewMore(item)"
                class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 dark:border-white/10 dark:bg-white/3 dark:text-gray-200 dark:hover:bg-white/6"
                aria-label="Voir"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>

              <button
                *ngIf="canEditOrDelete"
                type="button"
                (click)="handleEdit(item)"
                class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-green-600 hover:bg-gray-50 dark:border-white/10 dark:bg-white/3 dark:text-green-400 dark:hover:bg-white/6"
                aria-label="Modifier"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>

              <button
                *ngIf="canEditOrDelete"
                type="button"
                (click)="handleDelete(item)"
                class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-red-600 hover:bg-gray-50 dark:border-white/10 dark:bg-white/3 dark:text-red-400 dark:hover:bg-white/6"
                aria-label="Supprimer"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div
    *ngIf="totalPages > 1 || serverSidePagination"
    class="flex flex-col gap-3 border-t border-gray-200 px-5 py-3 dark:border-white/10 sm:flex-row sm:items-center sm:justify-between"
  >
    <div class="text-sm text-gray-500 dark:text-gray-400">
      Page {{ currentPage }} / {{ totalPages }} • Total {{ totalItemsLabel }}
    </div>

    <div class="flex items-center gap-2">
      <label class="text-sm text-gray-500 dark:text-gray-400">Items:</label>
      <select
        class="h-9 rounded-lg border border-gray-200 bg-white px-2 text-sm text-gray-700 dark:border-white/10 dark:bg-white/3 dark:text-gray-200"
        [value]="itemsPerPage"
        (change)="onItemsPerPageSelect(($any($event.target).value))"
      >
        <option [value]="10">10</option>
        <option [value]="20">20</option>
        <option [value]="50">50</option>
      </select>

      <button
        class="h-9 rounded-lg border border-gray-200 bg-white px-3 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 dark:border-white/10 dark:bg-white/3 dark:text-gray-200 dark:hover:bg-white/6"
        (click)="goToPage(currentPage - 1)"
        [disabled]="currentPage <= 1"
      >
        Prev
      </button>

      <button
        class="h-9 rounded-lg border border-gray-200 bg-white px-3 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 dark:border-white/10 dark:bg-white/3 dark:text-gray-200 dark:hover:bg-white/6"
        (click)="goToPage(currentPage + 1)"
        [disabled]="currentPage >= totalPages"
      >
        Next
      </button>
    </div>
  </div>
</div>
