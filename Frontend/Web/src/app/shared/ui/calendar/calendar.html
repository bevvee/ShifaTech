<section class="py-8 bg-white">
  <div class="max-w-7xl mx-auto px-4">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-6">
      <h5 class="text-xl font-semibold text-gray-900">
        {{ month }}
      </h5>

      <div class="flex gap-2">
        <button class="p-2 rounded hover:bg-gray-100 text-gray-500">‹</button>
        <button class="p-2 rounded hover:bg-gray-100 text-gray-500">›</button>
      </div>
    </div>

    <!-- CALENDAR GRID -->
    <div class="grid grid-cols-7 border border-gray-200 rounded-xl overflow-hidden">

      <div
        *ngFor="let d of days"
        class="p-3 min-h-[90px] lg:h-28 border-r border-b border-gray-200
               flex flex-col justify-between hover:bg-gray-50 transition"
      >

        <!-- DAY NUMBER -->
        <span
          class="text-xs font-semibold w-7 h-7 flex items-center justify-center rounded-full"
          [ngClass]="d === 12 ? 'bg-[#3CA169] text-white' : 'text-gray-900'"
        >
          {{ d }}
        </span>

        <!-- APPOINTMENT AVATARS -->
        <div class="flex items-center -space-x-2 mt-2">

          <ng-container *ngFor="let ap of getAppointmentsForDay(d) | slice:0:4">
            <img
              [src]="ap.patientAvatar"
              class="w-6 h-6 rounded-full border-2 border-white object-cover shadow-sm"
            />
          </ng-container>

          <!-- +X indicator -->
          <ng-container
            *ngIf="getAppointmentsForDay(d).length > 4">
            <div
              class="w-6 h-6 rounded-full bg-gray-200 text-[10px]
                     flex items-center justify-center font-semibold text-gray-700 border-2 border-white">
              +{{ getAppointmentsForDay(d).length - 4 }}
            </div>
          </ng-container>

        </div>

      </div>

    </div>
  </div>
</section>
