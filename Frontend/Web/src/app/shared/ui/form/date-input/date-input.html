<div #root class="w-full">
  <label *ngIf="label" class="mb-1 block text-sm font-medium text-slate-700">
    {{ label }} <span *ngIf="required" class="text-red-500">*</span>
  </label>

  <div class="relative">
    <!-- Input (readonly) -->
    <button
      type="button"
      (click)="toggle()"
      class="w-full text-left"
    >
      <div
        class="h-10 w-full rounded-xl border bg-white px-3 flex items-center justify-between
               outline-none transition
               border-slate-200 hover:border-slate-300
               focus-within:ring-4 focus-within:ring-blue-100"
        [class.border-red-400]="invalid"
        [class.ring-4]="open"
        [class.ring-blue-100]="open"
        [class.border-blue-600]="open"
      >
        <span class="text-sm text-slate-900" [class.text-slate-400]="!valueText">
          {{ valueText || placeholder }}
        </span>

        <!-- small calendar icon -->
        <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none">
          <path d="M7 2v3M17 2v3M4 7h16M6 10h4M6 14h4M14 10h4M14 14h4"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </button>

    <!-- Error -->
    <p *ngIf="invalid" class="mt-1 text-xs text-red-500">
      Champ invalide.
    </p>

    <!-- Popup -->
    <div
      *ngIf="open"
      class="absolute z-50 mt-2 w-full max-w-xs rounded-2xl bg-white shadow-xl border border-slate-200 overflow-hidden"
    >
      <!-- header -->
      <div class="px-3 py-2 flex items-center justify-between gap-2">
        <button
          type="button"
          (click)="prevMonth()"
          class="h-8 w-8 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="flex items-center gap-2 min-w-0">
          <select
            class="h-8 rounded-xl border border-slate-200 bg-white px-2 text-sm text-slate-900 outline-none
                   hover:border-slate-300 focus:ring-4 focus:ring-blue-100 focus:border-blue-600"
            [value]="viewMonth"
            (change)="setMonth($any($event.target).value)"
            aria-label="Month"
          >
            <option *ngFor="let m of monthOptions; let i = index" [value]="i">{{ m }}</option>
          </select>

          <select
            class="h-8 rounded-xl border border-slate-200 bg-white px-2 text-sm text-slate-900 outline-none
                   hover:border-slate-300 focus:ring-4 focus:ring-blue-100 focus:border-blue-600"
            [value]="viewYear"
            (change)="setYear($any($event.target).value)"
            aria-label="Year"
          >
            <option *ngFor="let y of yearOptions" [value]="y">{{ y }}</option>
          </select>
        </div>

        <button
          type="button"
          (click)="nextMonth()"
          class="h-8 w-8 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- weekdays -->
      <div class="px-3 pb-2">
        <div class="grid grid-cols-7 text-xs text-slate-500">
          <div *ngFor="let d of weekDays" class="py-2 text-center">
            {{ d }}
          </div>
        </div>

        <!-- days -->
        <div class="grid grid-cols-7 gap-y-1 pb-4">
          <button
            *ngFor="let cell of grid"
            type="button"
            (click)="pick(cell.date)"
            [disabled]="isDisabled(cell.date)"
            class="h-8 w-8 mx-auto rounded-xl text-xs font-medium
                   flex items-center justify-center
                   transition"
            [ngClass]="{
              'text-slate-300 cursor-default': !cell.inMonth,
              'text-slate-800 hover:bg-slate-100': cell.inMonth && !isSelected(cell.date) && !isDisabled(cell.date),
              'bg-blue-600 text-white': isSelected(cell.date),
              'opacity-40 cursor-not-allowed': isDisabled(cell.date)
            }"
          >
            {{ cell.day }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
