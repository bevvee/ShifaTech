<div class="w-full">
  <!-- Hidden input -->
  <input
    #fileInput
    type="file"
    class="hidden"
    [accept]="accept"
    [disabled]="disabled"
    (change)="onBrowseSelected($event)"
  />

  <!-- Preview card -->
  <ng-container *ngIf="file && previewUrl">
    <div class="relative mt-2 p-2 bg-white border border-slate-200 rounded-xl">
      <img class="mb-2 w-full h-44 object-cover rounded-lg" [src]="previewUrl" alt="preview" />

      <div class="mb-1 flex justify-between items-center gap-x-3 whitespace-nowrap">
        <div class="w-10">
          <span class="text-sm text-slate-700">
            {{ progress }}%
          </span>
        </div>

        <div class="flex items-center gap-x-2">
          <button
            type="button"
            (click)="remove()"
            class="text-slate-500 hover:text-slate-900"
            [disabled]="disabled"
          >
            <!-- trash -->
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              <line x1="10" x2="10" y1="11" y2="17"></line>
              <line x1="14" x2="14" y1="11" y2="17"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="flex w-full h-2 bg-slate-100 rounded-full overflow-hidden" role="progressbar"
           [attr.aria-valuenow]="progress" aria-valuemin="0" aria-valuemax="100">
        <div
          class="h-full rounded-full bg-blue-600 transition-all duration-500"
          [style.width.%]="progress"
        ></div>
      </div>
    </div>
  </ng-container>

  <!-- Drop zone (show when no file selected) -->
  <div
    class="cursor-pointer p-12 flex justify-center bg-white border border-dashed rounded-xl transition"
    [class.border-blue-500]="isDragging"
    [class.bg-blue-50]="isDragging"
    [class.border-slate-200]="!isDragging"
    (click)="triggerPick()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div class="text-center">
      <span class="inline-flex justify-center items-center size-16">
        <!-- big icon -->
        <svg class="shrink-0 w-16 text-blue-600 mx-auto" viewBox="0 0 73 47" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M54.519 40.4773V6.76876C54.519 3.92686 52.2121 1.62305 49.3664 1.62305H22.7076C19.8619 1.62305 17.555 3.92686 17.555 6.76876V40.4773M54.519 40.4773C54.519 43.3192 52.2121 45.6231 49.3664 45.6231H22.7076C19.8619 45.6231 17.555 43.3192 17.555 40.4773M54.519 40.4773L54.5189 34.6563L48.6564 28.3566L43.2612 34.6373C42.4421 35.5908 40.9662 35.5955 40.141 34.6472L30.3406 23.3844L17.555 36.9154V40.4773M6.20483 9.59424L17.707 7.6798V42.5188L12.6457 43.5828C9.25658 44.2954 5.94238 42.0892 5.29702 38.691L1.14643 16.8357C0.500082 13.4322 2.78322 10.1637 6.20483 9.59424ZM65.8691 9.59424L54.3669 7.6798V42.5188L59.4282 43.5828C62.8173 44.2954 66.1316 42.0892 66.7769 38.691L70.9274 16.8357C71.5738 13.4322 69.2907 10.1637 65.8691 9.59424ZM45.0584 15.3561C45.0584 17.7228 43.1372 19.6413 40.7673 19.6413C38.3974 19.6413 36.4762 17.7228 36.4762 15.3561C36.4762 12.9894 38.3974 11.0708 40.7673 11.0708C43.1372 11.0708 45.0584 12.9894 45.0584 15.3561Z"
            stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>

      <div class="mt-4 flex flex-wrap justify-center text-sm text-slate-500">
        <span class="pe-1 font-medium text-slate-900">{{ title }}</span>
        <span
          class="font-semibold text-blue-600 hover:text-blue-700 underline underline-offset-2"
          (click)="$event.stopPropagation(); triggerPick()"
        >
          {{ browseText }}
        </span>
      </div>

      <p class="mt-1 text-xs text-slate-500">
        {{ hint }}
      </p>
    </div>
  </div>
</div>
