<div class="flex flex-wrap items-center gap-3 sm:gap-5">
  <!-- Avatar preview / trigger -->
  <div class="group cursor-pointer" (click)="triggerPick()">
    <ng-container *ngIf="previewUrl; else emptyAvatar">
      <div class="size-20 rounded-full overflow-hidden border border-slate-200 bg-white">
        <img [src]="previewUrl" class="w-full h-full object-cover" alt="Profile preview" />
      </div>
    </ng-container>

    <ng-template #emptyAvatar>
      <span
        class="flex shrink-0 justify-center items-center size-20 bg-white border-2 border-dotted border-slate-300 text-slate-500 rounded-full hover:bg-slate-50"
      >
        <!-- user icon -->
        <svg class="shrink-0 size-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="10" r="3"/>
          <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/>
        </svg>
      </span>
    </ng-template>

    <!-- Hidden input -->
    <input
      #fileInput
      type="file"
      class="hidden"
      [accept]="accept"
      [disabled]="disabled"
      (change)="onFileSelected($event)"
    />
  </div>

  <!-- Buttons -->
  <div class="grow">
    <div class="flex items-center gap-x-2">
      <button
        type="button"
        (click)="triggerPick()"
        [disabled]="disabled"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-xs font-medium rounded-lg
               bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none"
      >
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" x2="12" y1="3" y2="15"></line>
        </svg>
        {{ label }}
      </button>

      <button
        type="button"
        (click)="clear()"
        [disabled]="disabled"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-xs rounded-lg
               bg-white border border-slate-200 text-red-600 hover:bg-slate-50
               disabled:opacity-50 disabled:pointer-events-none"
      >
        Delete
      </button>
    </div>
  </div>
</div>
