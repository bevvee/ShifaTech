<div class="w-full" (keydown)="onKeydown($event)">
  <label *ngIf="label" class="block text-sm font-medium text-slate-700 mb-1">
    {{ label }}
    <span *ngIf="required" class="text-red-500">*</span>
  </label>

  <!-- Toggle -->
  <button
    type="button"
    class="relative py-3 ps-4 pe-10 flex items-center w-full cursor-pointer bg-white border rounded-lg text-start text-sm
           hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-200"
    [class.border-red-500]="invalid"
    [class.border-slate-200]="!invalid"
    [class.opacity-50]="disabled"
    [class.pointer-events-none]="disabled"
    (click)="toggle()"
    aria-expanded="{{ open }}"
  >
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <ng-container *ngIf="selected?.iconUrl">
        <img class="inline-block size-4 rounded-full" [src]="selected!.iconUrl" alt="" />
      </ng-container>

      <span class="text-slate-900 truncate" *ngIf="selected; else ph">
        {{ selected!.label }}
      </span>

      <ng-template #ph>
        <span class="text-slate-400 truncate">{{ placeholder }}</span>
      </ng-template>
    </div>

    <!-- chevrons -->
    <span class="absolute top-1/2 end-3 -translate-y-1/2 text-slate-400">
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 15 5 5 5-5" />
        <path d="m7 9 5-5 5 5" />
      </svg>
    </span>
  </button>

  <!-- Error -->
  <p *ngIf="invalid" class="mt-1 text-xs text-red-600">
    Champ invalide.
  </p>

  <!-- Dropdown -->
  <div
    *ngIf="open"
    class="mt-2 max-h-72 pb-1 px-1 space-y-0.5 z-20 w-full bg-white border border-slate-200 rounded-lg shadow-xl
           overflow-hidden overflow-y-auto"
  >
    <!-- Search (sticky) -->
    <div class="bg-white p-2 -mx-1 sticky top-0 border-b border-slate-100">
      <input
        #searchInput
        type="text"
        class="block w-full text-sm bg-transparent border border-slate-200 rounded-lg text-slate-900 placeholder:text-slate-400
               focus:border-blue-400 focus:ring-2 focus:ring-blue-100 py-2 px-3"
        [placeholder]="searchPlaceholder"
        [value]="query"
        (input)="onSearch(($any($event.target)).value)"
      />
    </div>

    <!-- Options -->
    <button
      type="button"
      *ngFor="let opt of filtered; let i = index"
      class="py-2 px-4 w-full text-sm text-slate-800 text-left cursor-pointer rounded-lg
             hover:bg-slate-50 focus:outline-none"
      [class.bg-blue-50]="i === activeIndex"
      [class.opacity-50]="opt.disabled"
      [class.pointer-events-none]="opt.disabled"
      (mouseenter)="activeIndex = i"
      (click)="pick(opt)"
    >
      <div class="flex items-center">
        <ng-container *ngIf="opt.iconUrl">
          <img class="inline-block size-4 rounded-full me-2" [src]="opt.iconUrl" alt="" />
        </ng-container>

        <div class="text-slate-900">{{ opt.label }}</div>
      </div>
    </button>

    <div *ngIf="filtered.length === 0" class="py-3 px-4 text-sm text-slate-500">
      No results.
    </div>
  </div>
</div>
