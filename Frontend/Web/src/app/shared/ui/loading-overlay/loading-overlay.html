<div
  *ngIf="(loader.loading$ | async)"
  class="fixed inset-0 flex items-center justify-center bg-white z-[9999]"
  aria-hidden="true"
>
  <style>
    :host { display: contents; }
    :root { --blue:#2563eb; --green:#10b981; }

    .loader-svg { width: clamp(160px, 28vw, 280px); height:auto; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fillIn { to { fill-opacity: 1; } }
    @keyframes strokeOut { to { stroke-opacity: 0; } }

    .ring,.letterStroke{
      fill:none; stroke-linecap:round; stroke-linejoin:round;
      animation: draw 1.4s ease-out forwards;
    }
    .letterStroke{
      stroke-width:8;
      animation: draw 1.4s ease-out forwards, strokeOut .35s ease forwards;
    }
    .letterFill{ fill-opacity:0; animation: fillIn .55s ease forwards; }

    .S-stroke { animation-delay: .35s, 2.25s; }
    .S-fill   { animation-delay: 1.75s; }
    .F-stroke { animation-delay: .7s, 2.6s; }
    .F-fill   { animation-delay: 2.1s; }

    @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
  </style>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="loader-svg">
    <defs>
      <path id="SPath" d="M212.057983,152.740173 ... z"/>
      <path id="FPath" d="M314.350586,296.000061 ... z"/>
      <clipPath id="clipS"><use href="#SPath"/></clipPath>
      <clipPath id="clipF"><use href="#FPath"/></clipPath>
    </defs>

    <use href="#SPath" class="letterStroke S-stroke" clip-path="url(#clipS)"
         style="stroke:var(--blue); stroke-dasharray:2400; stroke-dashoffset:2400"/>

    <use href="#SPath" class="letterFill S-fill" style="fill:var(--blue)"/>

    <use href="#FPath" class="letterStroke F-stroke" clip-path="url(#clipF)"
         style="stroke:var(--green); stroke-dasharray:2600; stroke-dashoffset:2600"/>

    <use href="#FPath" class="letterFill F-fill" style="fill:var(--green)"/>
  </svg>
</div>
