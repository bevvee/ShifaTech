  <!-- App Loader Overlay: removed after Angular bootstrap -->
  <div id="app-loader" class="loader-overlay" aria-hidden="true">
    <div class="loader-brand" aria-label="ShifaTech">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="280" height="280" class="loader-svg">
        <style>
          .loader-overlay{ position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; background:#fff; z-index: 9999; }
          .loader-brand{ display:flex; align-items:center; justify-content:center; padding:16px; }
          .loader-svg{ width: clamp(160px, 28vw, 280px); height: auto; }
          @media (max-width: 420px){ .loader-brand{ padding:8px; } }
          @media (prefers-reduced-motion: reduce){
            .ring, .letterStroke, .letterFill{ animation: none !important; }
          }
          @keyframes fillIn { to { fill-opacity: 1; } }
          @keyframes strokeOut { to { stroke-opacity: 0; } }
          .ring{ fill:none; stroke: var(--blue); stroke-width:16; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray: var(--dash); stroke-dashoffset: var(--dash); animation: draw 1.4s ease-out forwards; }
          .letterStroke{ fill:none; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray: var(--dash); stroke-dashoffset: var(--dash); stroke-opacity:1; animation: draw 1.4s ease-out forwards, strokeOut .35s ease forwards; }
          .letterFill{ stroke:none; fill-opacity:0; animation: fillIn .55s ease forwards; }
          .S-stroke { animation-delay: .35s, 2.25s; }
          .S-fill { animation-delay: 1.75s; }
          .F-stroke { animation-delay: .70s, 2.60s; }
          .F-fill { animation-delay: 2.10s; }
        </style>
