spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/authdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: authuser
    password: authpass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
