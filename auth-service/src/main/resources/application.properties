# ===========================
# DATABASE CONFIGURATION
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE CONFIGURATION
# ===========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Use 'update' in dev to keep existing tables and add missing ones; avoid create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# JWT CONFIGURATION
# ===========================
jwt.secret=your-very-long-secret-key-with-at-least-32-characters
# 9 hours in milliseconds
jwt.accessMillis=32400000
# 7 days in milliseconds
jwt.refreshMillis=604800000


# ===========================
# FLYWAY CONFIGURATION
# ===========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===========================
# LOGGING
# ===========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
