version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    restart: always
    depends_on:
      - auth-service
      - rdv-service
      - patient-service
      - infirmier-service
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shifatech-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - auth-db
      - rdv-db
      - patient-db
      - infirmier-db
    environment:
      PMA_HOSTS: auth-db,rdv-db,patient-db,infirmier-db
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_ARBITRARY: 1
    ports:
      - "8083:80"
    networks:
      - shifatech-net

  auth-db:
    image: mysql:8.3
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    volumes:
      - auth_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net

  auth-service:
    build:
      context: ./Backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      - auth-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    networks:
      - shifatech-net

  rdv-db:
    image: mysql:8.3
    container_name: rdv-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rdvdb
      MYSQL_USER: rdvuser
      MYSQL_PASSWORD: rdvpass
    volumes:
      - rdv_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net

  rdv-service:
    build:
      context: ./Backend/rdv-service
      dockerfile: Dockerfile
    container_name: rdv-service
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend/rdv-service:/var/www/html
    depends_on:
      - rdv-db
    environment:
      DATABASE_URL: "mysql://rdvuser:rdvpass@rdv-db:3306/rdvdb?serverVersion=8.3&charset=utf8mb4"
    expose:
      - "9000"
    networks:
      - shifatech-net

  patient-db:
    image: mysql:8.0
    container_name: patient-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patientdb
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    volumes:
      - patient_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  patient-service:
    build:
      context: ./Backend/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      patient-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://patient-db:3306/patientdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user123
      JWT_SECRET: shifatech-secret-key-for-jwt-token-generation-and-validation-minimum-256-bits
      AUTH_SERVICE_URL: http://auth-service:8080
    networks:
      - shifatech-net

  infirmier-db:
    image: mysql:8.3
    container_name: infirmier-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: infirmierdb
      MYSQL_USER: infirmieruser
      MYSQL_PASSWORD: infirmierpass
    volumes:
      - infirmier_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net

  infirmier-service:
    build:
      context: ./Backend/infirmier-service
      dockerfile: Dockerfile
    container_name: infirmier-service
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend/infirmier-service:/var/www/html
    depends_on:
      - infirmier-db
    environment:
      DATABASE_URL: "mysql://infirmieruser:infirmierpass@infirmier-db:3306/infirmierdb?serverVersion=8.3&charset=utf8mb4"
    expose:
      - "9000"
    networks:
      - shifatech-net

networks:
  shifatech-net:

volumes:
  auth_mysql_data:
  rdv_mysql_data:
  patient_mysql_data:
  infirmier_mysql_data:
