version: "3.9"

services:
  ##################################
  # DATABASES
  ##################################
  auth-db:
    image: mysql:8.3
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    volumes:
      - auth_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rdv-db:
    image: mysql:8.3
    container_name: rdv-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rdvdb
      MYSQL_USER: rdvuser
      MYSQL_PASSWORD: rdvpass
    volumes:
      - rdv_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-db:
    image: mysql:8.3
    container_name: patient-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patientdb
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    volumes:
      - patient_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  infirmier-db:
    image: mysql:8.3
    container_name: infirmier-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: infirmierdb
      MYSQL_USER: infirmieruser
      MYSQL_PASSWORD: infirmierpass
    volumes:
      - infirmier_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  doctor-db:
    image: mysql:8.3
    container_name: doctor-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doctordb
      MYSQL_USER: doctoruser
      MYSQL_PASSWORD: doctorpass
    volumes:
      - doctor_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  body-db:
    image: mysql:8.3
    container_name: body-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bodydb
      MYSQL_USER: bodyuser
      MYSQL_PASSWORD: bodypass
    volumes:
      - body_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-db:
    image: mysql:8.0
    container_name: admin-db
    restart: always
    environment:
      MYSQL_DATABASE: admindb
      MYSQL_USER: adminuser
      MYSQL_PASSWORD: adminpass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - admin_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ##################################
  # BACKEND SERVICES
  ##################################
  auth-service:
    build: ./Backend/auth-service
    container_name: auth-service
    restart: always
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass
      SERVER_PORT: 8080
    expose:
      - "8080"
    networks:
      - shifatech-net

  rdv-service:
    build: ./Backend/rdv-service
    container_name: rdv-service
    restart: unless-stopped
    depends_on:
      rdv-db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://rdvuser:rdvpass@rdv-db:3306/rdvdb
    expose:
      - "9000"
    networks:
      - shifatech-net
    volumes:
      - ./Backend/rdv-service/src:/var/www/html/src
      - ./Backend/rdv-service/config:/var/www/html/config
      - ./Backend/rdv-service/public:/var/www/html/public
      - ./Backend/rdv-service/templates:/var/www/html/templates
      - ./Backend/rdv-service/migrations:/var/www/html/migrations
      - /var/www/html/vendor
      - rdv-service-logs:/var/www/html/var/log
      - rdv-service-cache:/var/www/html/var/cache  

  patient-service:
    build: ./Backend/patient-service
    container_name: patient-service
    restart: always
    depends_on:
      patient-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://patient-db:3306/patientdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user123
      AUTH_SERVICE_URL: http://auth-service:8080
      RDV_SERVICE_URL: http://nginx-gateway/rdv
    expose:
      - "8080"
    networks:
      - shifatech-net

  infirmier-service:
    build: ./Backend/infirmier-service
    container_name: infirmier-service
    restart: unless-stopped
    depends_on:
      infirmier-db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://infirmieruser:infirmierpass@infirmier-db:3306/infirmierdb
    expose:
      - "9000"
    networks:
      - shifatech-net
    volumes:
      - ./Backend/infirmier-service:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/var

  doctor-service:
    build: ./Backend/doctor-service
    container_name: doctor-service
    restart: always
    depends_on:
      doctor-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://doctor-db:3306/doctordb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: doctoruser
      SPRING_DATASOURCE_PASSWORD: doctorpass
      SERVER_PORT: 8080
    expose:
      - "8080"
    networks:
      - shifatech-net

  body-service:
    build: ./Backend/body-service
    container_name: body-service
    restart: unless-stopped
    depends_on:
      body-db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://bodyuser:bodypass@body-db:3306/bodydb
    expose:
      - "9000"
    networks:
      - shifatech-net


  admin-service:
    build: ./Backend/admin-service
    container_name: admin-service
    restart: unless-stopped
    depends_on:
      admin-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://admin-db:3306/admindb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: adminuser
      SPRING_DATASOURCE_PASSWORD: adminpass
      SERVICES_DOCTOR_URL: http://doctor-service:8080
      SERVICES_INFIRMIER_URL: http://infirmier-service:8080
    expose:
      - "8080"
    networks:
      - shifatech-net
  ##################################
  # FRONTEND
  ##################################
  web-service:
    build:
      context: ./Frontend/Web
      dockerfile: Dockerfile
    container_name: web-service
    expose:
      - "4200"
    volumes:
      - ./Frontend/Web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=2048
    command: npm start
    networks:
      - shifatech-net

  ##################################
  # NGINX GATEWAY
  ##################################
  nginx:
    image: openresty/openresty:alpine
    container_name: nginx-gateway
    restart: always
    depends_on:
      - web-service
      - auth-service
      - patient-service
      - doctor-service
      - infirmier-service
      - rdv-service
      - body-service
      - admin-service
    ports:
      - "8082:80"
    volumes:
      - ./Backend/rdv-service/public:/var/www/rdv/public:ro
      - ./Backend/infirmier-service/public:/var/www/infirmier/public:ro
      - ./Backend/body-service/public:/var/www/body/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shifatech-net

  ##################################
  # PHPMyAdmin
  ##################################
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOSTS: auth-db,rdv-db,patient-db,infirmier-db,doctor-db,body-db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8083:80"
    networks:
      - shifatech-net
  ##################################
  # SMTP (MailHog)
  ##################################
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - shifatech-net
  ##################################
  # MONITORING (Prometheus)
  ##################################
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - shifatech-net

  ##################################
  # MONITORING (Grafana)
  ##################################
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    networks:
      - shifatech-net

##################################
# NETWORKS & VOLUMES
##################################
networks:
  shifatech-net:


volumes:
  auth_mysql_data:
  rdv_mysql_data:
  patient_mysql_data:
  infirmier_mysql_data:
  doctor_mysql_data:
  admin_mysql_data:
  rdv-service-logs:
  rdv-service-cache:
  body_mysql_data:
  grafana-storage:
