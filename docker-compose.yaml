version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    restart: always
    depends_on:
      - auth-service
      - rdv-service
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shifatech-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - auth-db
      - rdv-db
    environment:
      PMA_HOSTS: auth-db,rdv-db
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_ARBITRARY: 1
    ports:
      - "8083:80"
    networks:
      - shifatech-net

  auth-db:
    image: mysql:8.3
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    ports:
      - "3307:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      - auth-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    networks:
      - shifatech-net

  rdv-db:
    image: mysql:8.3
    container_name: rdv-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rdvdb
      MYSQL_USER: rdvuser
      MYSQL_PASSWORD: rdvpass
    ports:
      - "3308:3306"
    volumes:
      - rdv_mysql_data:/var/lib/mysql
    networks:
      - shifatech-net

  rdv-service:
    build:
      context: ./rdv-service
      dockerfile: Dockerfile
    container_name: rdv-service
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./rdv-service:/var/www/html
    depends_on:
      - rdv-db
    environment:
      DATABASE_URL: "mysql://rdvuser:rdvpass@rdv-db:3306/rdvdb?serverVersion=8.3&charset=utf8mb4"
    expose:
      - "9000"
    networks:
      - shifatech-net

networks:
  shifatech-net:

volumes:
  auth_mysql_data:
  rdv_mysql_data:
