version: "3.9"

services:
  # ===================== NGINX API GATEWAY =====================
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    restart: always
    depends_on:
      - auth-service
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  # ===================== PHPMYADMIN =====================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - auth-db
    environment:
      PMA_HOST: auth-db
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_ARBITRARY: 1
    ports:
      - "8083:80"
  # ===================== Auth-db =====================
  auth-db:
    image: mysql:8.3
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  # ===================== AUTH SERVICE =====================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      - auth-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
  # ===================== PATIENT SERVICE =====================
  # ===================== patient-db =====================
volumes:
  mysql_data:
