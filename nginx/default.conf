upstream web_service {
    server web-service:4200;
}

upstream auth_service {
    server auth-service:8080;
}

upstream patient_service {
    server patient-service:8080;
}

upstream doctor_service {
    server doctor-service:8080;
}

upstream infirmier_service {
     server infirmier-service:9000;
}

upstream rdv_service {
    server rdv-service:9000;
}
upstream body_service {
    server body-service:9000;
}
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://web_service;
        proxy_http_version 1.1;

        # WebSocket support (MANDATORY for ng serve)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth/ {
        proxy_pass http://auth_service/api/auth/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /patient/ {
        proxy_pass http://patient_service/api/patient/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /doctor/ {
        proxy_pass http://doctor_service/api/doctors/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /infirmier/ {
        rewrite ^/infirmier/(.*)$ /api/infirmier/$1 break;
        proxy_pass http://infirmier_service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /rdv/ {
        proxy_pass http://rdv_service/;
    }

    location ^~ /body/ {
        proxy_pass http://body_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
