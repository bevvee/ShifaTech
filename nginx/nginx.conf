user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict route_roles 10m;

    init_by_lua_block {
        local cjson = require("cjson")
        local file = io.open("/etc/nginx/route_roles.json", "r")
        local data = file:read("*all")
        file:close()

        local decoded = cjson.decode(data)
        local dict = ngx.shared.route_roles

        for _, item in ipairs(decoded.routes) do
            local key = item.method .. ":" .. item.route
            dict:set(key, cjson.encode(item.allowed_roles))
        end
    }

    # Function to check JWT + role
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    server {
        listen 80;
        server_name _;

        # ============ HEALTH CHECK ============
        location = / {
            return 200 "NGINX Gateway running\n";
        }

        # ============ AUTH SERVICE ============
        location /auth/ {
            proxy_pass http://auth-service:8080/;
        }

        # ============ PROTECTED ROUTES ============
        location /courses/ {
            access_by_lua_block {
                local jwt = require("resty.jwt")
                local cjson = require("cjson")

                -- Extract Auth header
                local auth_header = ngx.var.http_authorization
                if not auth_header then
                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end

                local _, _, token = string.find(auth_header, "Bearer%s+(.+)")
                if not token then
                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end

                -- Validate JWT
                local jwt_obj = jwt:verify("your-public-key-here", token)
                if not jwt_obj["verified"] then
                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end

                local user_roles = jwt_obj.payload.roles

                -- Build route key
                local method = ngx.req.get_method()
                local uri = ngx.var.uri

                local dict = ngx.shared.route_roles
                local key = method .. ":" .. uri
                local rule = dict:get(key)

                if not rule then
                    return ngx.exit(ngx.HTTP_FORBIDDEN)
                end

                local allowed_roles = cjson.decode(rule)

                -- Check role intersection
                local has_role = false
                for _, role in ipairs(user_roles) do
                    for _, allowed in ipairs(allowed_roles) do
                        if role == allowed then
                            has_role = true
                        end
                    end
                end

                if not has_role then
                    return ngx.exit(ngx.HTTP_FORBIDDEN)
                end
            }

            # Forward to Microservice
            proxy_pass http://course-service:8080/;
        }
    }
}
