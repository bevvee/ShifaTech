global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'patient-service'
    metrics_path: '/patient/actuator/prometheus'
    static_configs:
      - targets: ['nginx-gateway:80']

  - job_name: 'doctor-service'
    metrics_path: '/doctor/actuator/prometheus'
    static_configs:
      - targets: ['nginx-gateway:80']
  - job_name: 'auth-service'
    metrics_path: '/auth/actuator/prometheus'
    static_configs:
      - targets: ['nginx-gateway:80']